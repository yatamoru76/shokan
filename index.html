 const cd=d.querySelector(".dcard");if(cd){cd.style.transition="transform .22s ease-in,opacity .22s";cd.style.transform=`translateX(${-dir*120}%) rotate(${-dir*8}deg)`;cd.style.opacity=0}
 stopScene();sfx.swipe();setTimeout(()=>{detSlide=dir>0?"inR":"inL";d.scrollTop=0;showDetail(next)},200)}
(function(){let sx=0,sy=0,on=false,t0=0;const d=document.getElementById("detail");
 d.addEventListener("pointerdown",e=>{if(e.target.closest("button,a,input"))return;sx=e.clientX;sy=e.clientY;on=true;t0=Date.now()});
 d.addEventListener("pointermove",e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;const cd=d.querySelector(".dcard");if(cd&&Math.abs(dx)>Math.abs(dy)&&NAV.length>1){cd.style.transition="none";cd.style.transform=`translateX(${dx*.6}px) rotate(${dx/40}deg)`}});
 const end=e=>{if(!on)return;on=false;const dx=e.clientX-sx,dy=e.clientY-sy;const cd=d.querySelector(".dcard");
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3&&NAV.length>1){navDetail(dx<0?1:-1)}else if(cd){cd.style.transition="transform .3s cubic-bezier(.3,1.4,.5,1)";cd.style.transform=""}};
 d.addEventListener("pointerup",end);d.addEventListener("pointercancel",end)})();

let YTP=null,YTloop=null,ytApi=null;
try{if(localStorage.getItem("otaku_scene")===null)localStorage.setItem("otaku_scene","1")}catch(_){}
const sceneOn=()=>{try{return localStorage.getItem("otaku_scene")!=="0"}catch(_){return true}};
function loadYT(){if(ytApi)return ytApi;ytApi=new Promise((res,rej)=>{if(window.YT&&YT.Player)return res();window.onYouTubeIframeAPIReady=()=>res();const sc=document.createElement("script");sc.src="https://www.youtube.com/iframe_api";sc.onerror=rej;document.head.appendChild(sc);setTimeout(()=>rej(new Error("timeout")),8000)});ytApi.catch(()=>{ytApi=null});return ytApi}
function stopScene(){clearInterval(YTloop);YTloop=null;if(YTP){try{YTP.destroy()}catch(_){}YTP=null}}
async function startScene(c){stopScene();const d=$("detail");const box=d.querySelector(".dvid");if(!box||!c.trailer||!sceneOn()||RI[c.rarity]<4)return;
 try{await loadYT()}catch(_){return}if(!box.isConnected||d.dataset.cid!==String(c.id))return;
 const holder=document.createElement("div");box.appendChild(holder);let start=0;
 const st=30+Math.floor(Math.random()*25);
 YTP=new YT.Player(holder,{videoId:c.trailer,playerVars:{autoplay:1,mute:1,controls:0,playsinline:1,rel:0,modestbranding:1,iv_load_policy:3,disablekb:1,fs:0,cc_load_policy:0,showinfo:0,start:st,end:st+10},
  events:{onReady:e=>{try{e.target.mute()}catch(_){}},
   onStateChange:e=>{if(e.data===1)box.classList.add("on");if(e.data===2)box.classList.remove("on");if(e.data===0){try{e.target.loadVideoById({videoId:c.trailer,startSeconds:st,endSeconds:st+10})}catch(_){}}},onError:()=>{stopScene();box.classList.remove("on")}}})}

// ================= FONDS ANIMÉS (Mythique, Divin, Cosmos) =================
let FX=null;
function stopFx(){if(FX){cancelAnimationFrame(FX.raf);FX=null}stopScene()}
function startFx(r){stopFx();const cv=$("detail").querySelector(".fx");if(!cv)return;const dpr=Math.min(2,window.devicePixelRatio||1);
 const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);const P=[],rnd=(a,b)=>a+Math.random()*(b-a);
 const N=r==="X"?110:r==="D"?55:45;
 for(let i=0;i<N;i++)P.push(newP(true));
 function newP(init){if(r==="M")return{x:rnd(0,W),y:init?rnd(0,H):H+10,vx:rnd(-.3,.3),vy:rnd(-1.3,-.4),s:rnd(1,3.2),l:rnd(.4,1),c:Math.random()<.6?"255,77,109":"255,181,71",ph:rnd(0,6)};
  if(r==="D")return{x:rnd(0,W),y:init?rnd(0,H):H+10,vx:rnd(-.15,.15),vy:rnd(-.5,-.15),s:rnd(1,2.6),l:1,c:Math.random()<.7?"255,217,106":"255,255,255",ph:rnd(0,6)};
  return{x:rnd(0,W),y:rnd(0,H*.95),vx:0,vy:0,s:rnd(.4,1.8),l:1,c:Math.random()<.2?"155,134,255":Math.random()<.2?"0,229,255":"255,255,255",ph:rnd(0,6),tw:rnd(.02,.07)}}
 let shoot=null,t=0;
 FX={raf:0};const loop=()=>{t++;g.clearRect(0,0,W,H);
  for(let i=0;i<P.length;i++){const p=P[i];p.x+=p.vx+(r==="M"?Math.sin(t/30+p.ph)*.3:0);p.y+=p.vy;
   let a=r==="X"?.35+.65*Math.abs(Math.sin(t*p.tw+p.ph)):r==="M"?Math.min(1,p.y/H*1.4)*(.6+.4*Math.sin(t/6+p.ph)):(.5+.5*Math.sin(t/25+p.ph))*Math.min(1,p.y/H*1.5);
   if(r!=="X"&&p.y<-10){P[i]=newP(false);continue}
   g.beginPath();g.fillStyle=`rgba(${p.c},${a.toFixed(3)})`;g.shadowBlur=r==="X"?4:10;g.shadowColor=`rgba(${p.c},1)`;g.arc(p.x,p.y,p.s,0,Math.PI*2);g.fill()}
  if(r==="X"){if(!shoot&&Math.random()<.012)shoot={x:rnd(W*.2,W),y:rnd(0,H*.4),l:0};
   if(shoot){shoot.l+=1;const x=shoot.x-shoot.l*7,y=shoot.y+shoot.l*3.2;const gr=g.createLinearGradient(x,y,x+70,y-32);gr.addColorStop(0,"rgba(255,255,255,.95)");gr.addColorStop(1,"rgba(255,255,255,0)");
    g.strokeStyle=gr;g.lineWidth=2;g.shadowBlur=8;g.shadowColor="#9b86ff";g.beginPath();g.moveTo(x,y);g.lineTo(x+70,y-32);g.stroke();if(shoot.l>40)shoot=null}}
  g.shadowBlur=0;FX.raf=requestAnimationFrame(loop)};loop()}

function ago(t){const s=Math.floor((Date.now()-t)/1000);return s<60?"à l'instant":s<3600?"il y a "+Math.floor(s/60)+" min":s<86400?"il y a "+Math.floor(s/3600)+" h":"il y a "+Math.floor(s/86400)+" j"}
function showNotifs(){const p=$("picker");const L=S.notifs||[];p.style.display="flex";

function stageKey(w,s){return w+"-"+s}
function stageStars(w,s){return S.prog[stageKey(w,s)]||0}
function stageOpen(w,s){if(w===0&&s===1)return true;if(s>1)return stageStars(w,s-1)>0;return stageStars(w-1,10)>0}
function enemyP(g){return 55*Math.pow(1.115,g-1)}
const WRAR=[{m:["C"],b:"R"},{m:["C","R"],b:"E"},{m:["R","E"],b:"L"},{m:["E","L"],b:"M"},{m:["L","M"],b:"D"}];
async function foeCard(rid,seed){const r=RAR[RI[rid]];return charAt(r.min+hash(seed)%(r.max-r.min+1),r)}
function mkFoe(card,P,boss){const k=clsOf(card),e=elOf(card);return{name:card.name,img:card.img,card,rarity:card.rarity,el:e,cls:k,maxhp:Math.round(P*9*k.hp*(boss?4.5:1)),atk:Math.round(P*.95*k.atk*(boss?1.5:1)),spd:k.spd+(boss?6:0),boss}}
// difficulté : les ennemis sont calibrés sur la puissance de TON équipe (et un plancher qui monte avec les mondes)
function stageRatio(w,s){return s===10?1.15+.07*w:.5+.045*(s-1)+.07*w}
function diffLabel(r){return r<.7?["Facile","var(--ok)"]:r<.9?["Normal","#4da3ff"]:r<1.1?["Difficile","#ffb547"]:["Très difficile","var(--M)"]}
function scaleFoes(list,ratio,floorP){const unit=list.reduce((a,e)=>a+e.atk*3+e.maxhp/3,0),spd=list.reduce((a,e)=>a+e.spd,0);
 const P=Math.max(floorP,(teamPower()*ratio-spd)/Math.max(1,unit));list.forEach(e=>{e.maxhp=Math.max(1,Math.round(e.maxhp*P));e.atk=Math.max(1,Math.round(e.atk*P))});return list}
async function makeEnemies(w,s){const g=w*10+s,boss=s===10,R=WRAR[w];const n=boss?2:Math.min(5,2+Math.floor(s/3));
 if(!DEMO){try{const an=await pickAnime(w*100+s*7+3,w+1);const list=await animeFoes(an,n,boss,w*1000+s*37);list.anime=an;scaleFoes(list,stageRatio(w,s),enemyP(g)*.25);return list}catch(e){if(e instanceof TypeError){DEMO=true;$("demoBanner").style.display="block"}}}
 const cards=await Promise.all([...Array(n)].map((_,i)=>foeCard(R.m[(i+s)%R.m.length],w*1000+s*37+i*7+1)));const list=cards.map(c=>mkFoe(c,1,false));
 if(boss)list.splice(1,0,mkFoe(await foeCard(R.b,w*999+77),1,true));return scaleFoes(list,stageRatio(w,s),enemyP(g)*.25)}

// ===== adversaires d'un même anime + décor de leur univers =====
const QM=`query($p:Int){Page(page:$p,perPage:25){media(type:ANIME,sort:POPULARITY_DESC,isAdult:false,genre_not_in:["Ecchi","Hentai"]){id title{romaji english} bannerImage coverImage{extraLarge} characters(sort:FAVOURITES_DESC,perPage:12){nodes{id name{full} image{large} favourites}}}}}`;
const MPAGE={};
async function animePage(p){if(MPAGE[p])return MPAGE[p];const key="otaku_mp2_"+p;try{const c=JSON.parse(localStorage.getItem(key)||"null");if(c&&Date.now()-c.t<7*86400000){MPAGE[p]=c.list;return c.list}}catch(_){}
 let res;for(let a=0;a<3;a++){res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query:QM,variables:{p}})});if(res.status===429){await sleep(2500*(a+1));continue}break}
 if(!res.ok)throw new Error("HTTP "+res.status);const j=await res.json();const T=await favThresholds();
 const list=j.data.Page.media.map(m=>({id:m.id,title:m.title.english||m.title.romaji,bg:m.bannerImage||(m.coverImage&&m.coverImage.extraLarge),
  chars:(m.characters.nodes||[]).filter(c=>c.image&&c.image.large).map(c=>{const rid=rarFromFav(c.favourites||0,T);return{id:c.id,name:c.name.full,img:c.image.large,fav:c.favourites||0,series:m.title.english||m.title.romaji,rarity:rid,rank:rankFromFav(c.favourites||0,rid,T)}})})).filter(m=>m.chars.length>=3);
 MPAGE[p]=list;try{localStorage.setItem(key,JSON.stringify({t:Date.now(),list}))}catch(_){}return list}
async function pickAnime(seed,page){const L=await animePage(page);return L[hash(seed)%L.length]}
function battleBg(url){return url?`linear-gradient(180deg,#09090cee 0%,#09090c66 30%,#09090c66 65%,#09090cee 100%),url("${url}") center/cover`:null}
async function animeFoes(an,n,boss,seed){// le boss = le perso le plus aimé de l'anime, les autres = seconds rôles
 const pool=an.chars.slice(boss?1:0);const out=[];for(let i=0;i<n;i++)out.push(pool[(hash(seed+i*13)%Math.min(pool.length,8)+i)%pool.length]);
 const uniq=[...new Map(out.map(c=>[c.id,c])).values()];while(uniq.length<n&&uniq.length<pool.length){const c=pool.find(x=>!uniq.includes(x));if(!c)break;uniq.push(c)}
 const list=uniq.map(c=>mkFoe(c,1,false));if(boss)list.splice(1,0,mkFoe(an.chars[0],1,true));return list}

const VAL={C:6,R:18,E:60,L:220,M:850,D:3200,X:12000};
const BOTS=["Sakura_77","NekoKing","Takeshi.exe","Mangaka_FR","Yuki-chan","OniGiri99","ZoroSensei","KawaiiDesu","ShadowNinja","Ramen4Life","Kitsune_x","OtakuSupreme","Hinata.jpg","DattebayoLeo","Mochi_Mochi","SenpaiNotice"];
const TAX=.05;
function cardValue(c){const r=RAR[RI[c.rarity]];const pop=1+.6*(r.max-c.rank)/(r.max-r.min+1);return Math.max(1,Math.round(VAL[c.rarity]*pop*(1+.6*((c.star||1)-1))))}
function mkState(){if(!S.mk)S.mk={listings:[],listAt:0,sales:[],auctions:[],offers:[],offAt:0,hist:[],last:Date.now()};return S.mk}
function slim(c){return{id:c.id,name:c.name,img:c.img,series:c.series,fav:c.fav,rarity:c.rarity,rank:c.rank,star:c.star||1}}
function addCard(c){const o=S.coll[c.id]||Object.assign(slim(c),{n:0,lvl:1,xp:0,star:1});o.n++;S.coll[c.id]=o;return o}
function takeCard(id){const c=S.coll[id];if(!c)return null;const copy=slim(c);if(c.n>1)c.n--;else{delete S.coll[id];S.team=S.team.filter(x=>x!==+id)}return copy}
function hist(t){const m=mkState();m.hist.unshift(new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})+" · "+t);m.hist=m.hist.slice(0,15)}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function rollW(w){const t=Object.values(w).reduce((a,b)=>a+b,0);let x=Math.random()*t;for(const k in w){if((x-=w[k])<=0)return k}return"C"}
async function randCard(w){const r=RAR[RI[rollW(w)]];const c=await charAt(r.min+Math.floor(Math.random()*(r.max-r.min+1)),r);return slim(c)}
let mkBusy=false,mkTab="buy";
async function genListings(){const m=mkState();if(mkBusy)return;mkBusy=true;try{const W={C:40,R:30,E:18,L:9,M:2.5,D:.4,X:.1};
 const cards=await Promise.all([...Array(10)].map(()=>randCard(W)));m.listings=cards.map(c=>({c,seller:pick(BOTS),price:Math.round(cardValue(c)*(.75+Math.random()*.7)),id:Math.random().toString(36).slice(2)}));m.listAt=Date.now()+20*60000;save()}
 catch(e){toast("😵 Marché indisponible : "+e.message)}mkBusy=false;if(view==="mk")rMarket()}
async function genAuction(){const c=await randCard({E:55,L:30,M:11,D:3,X:1});const v=cardValue(c);
 return{id:Math.random().toString(36).slice(2),c,seller:pick(BOTS),bid:0,start:Math.max(5,Math.round(v*.45)),leader:null,hold:0,end:Date.now()+(3+Math.random()*7)*60000,
  bots:[...Array(2+Math.floor(Math.random()*3))].map(()=>({n:pick(BOTS),max:Math.round(v*(.7+Math.random()*.85))}))}}
async function genOffer(){const mine=Object.values(S.coll);if(!mine.length)return null;const sp=mine.filter(c=>spare(c)>0);const y=pick(sp.length?sp:mine);const yv=cardValue(y);
 for(let k=0;k<4;k++){const ri=Math.max(0,Math.min(RAR.length-1,RI[y.rarity]+pick([-1,0,0,1])));const t=await randCard({[RAR[ri].id]:1});const tv=cardValue(t);
  if(t.id!==y.id&&tv>=yv*.75&&tv<=yv*1.5)return{id:Math.random().toString(36).slice(2),from:pick(BOTS),give:t,want:y.id,wantName:y.name,exp:Date.now()+15*60000}}return null}
async function fillMarket(){const m=mkState();if(mkBusy)return;mkBusy=true;try{

function b64e(str){return btoa(unescape(encodeURIComponent(str)))}function b64d(str){return decodeURIComponent(escape(atob(str)))}

async function drawRarity(rid){const r=RAR[RI[rid]];return charAt(r.min+Math.floor(Math.random()*(r.max-r.min+1)),r)}
async function giveRw(rw,why){S.boosters+=rw.boosters||0;S.shards+=rw.shards||0;S.oni+=rw.oni||0;S.frag+=rw.frag||0;let card=null;
 if(rw.title){S.titles=S.titles||[];if(!S.titles.includes(rw.title))S.titles.push(rw.title)}
 if(rw.card){try{card=await drawRarity(rw.card);card.isNew=!S.coll[card.id];addCard(card)}catch(e){S.boosters+=3;toast("Carte indisponible hors ligne : +3 boosters à la place")}}
 save();updateTop();sfx.coin();
 if(card){sfx.flip(RI[card.rarity]);modal(`<h3 style="margin:0 0 8px">${why||"Récompense"}</h3><div style="width:150px;margin:0 auto">${cardHTML(card)}</div><p><b style="color:var(--${card.rarity})">${esc(card.name)}</b>${card.isNew?" · NOUVEAU":""}</p>${rw.title?`<p>🏷️ Titre débloqué : <b>${esc(rw.title)}</b></p>`:""}`)}
 else toast("🎁 "+(rwText(rw)||"")+(rw.title?" 🏷️ Titre : "+rw.title:""));return card}
function rwLabel(rw){return[rw.card?"🎴 1 carte "+RAR[RI[rw.card]].name+" garantie":"",rwText(rw),rw.title?"🏷️ Titre « "+rw.title+" »":""].filter(Boolean).join(" · ")}

const PT=40,PXPT=150,PXP={open:30,win:20,raid:25,lvl:10,arena:30,graid:45,quest:50,login:60};
function seasonId(){return Math.max(0,Math.floor((Date.now()-SEASON_EPOCH)/SEASON_LEN))}
function seasonInfo(){const id=seasonId();return Object.assign({id,num:id+1,end:SEASON_EPOCH+(id+1)*SEASON_LEN},SEASONS[id%SEASONS.length])}
function passState(){const sid=seasonId();if(!S.pass||S.pass.sid!==sid){if(S.pass){const lost=passUnclaimed(S.pass);if(lost.length){const rw={boosters:0,shards:0,oni:0,frag:0};lost.forEach(t=>{const r=passRw(t);for(const k of["boosters","shards","oni","frag"])rw[k]+=r[k]||0;if(r.card)rw.boosters+=3});addGift("🎟️","Passe de la saison précédente","Les paliers que tu n'avais pas récupérés.",rw)}}S.pass={sid,xp:0,got:{}}}return S.pass}
function passLvl(P){P=P||passState();return Math.min(PT,Math.floor(P.xp/PXPT))}
function passUnclaimed(P){const l=passLvl(P),a=[];for(let t=1;t<=l;t++)if(!P.got[t])a.push(t);return a}
function passRw(t){const si=seasonInfo();if(t===PT)return{card:"M",title:"Héros · "+si.n};if(t===30)return{card:"L",frag:2};if(t%10===0)return{card:"L"};if(t%5===0)return{boosters:3,oni:5};

function passXp(n){const P=passState(),l0=passLvl(P);P.xp+=n;const l1=passLvl(P);if(l1>l0)notify("🎟️","Passe saisonnier : palier "+l1+" atteint !")}

// ================= SYNERGIES D'ÉQUIPE =================
function synergies(cards){const out=[];let atk=0,hp=0,spd=0;const ser={};cards.forEach(c=>{const k=(c.series||"?").toLowerCase();ser[k]=ser[k]||{n:c.series,c:0};ser[k].c++});
 Object.values(ser).forEach(s=>{if(s.c>=2&&s.n){const b=Math.min(40,(s.c-1)*10);atk+=b;hp+=b;out.push({ic:"📺",t:`${s.n} ×${s.c}`,d:`+${b} % ATQ et PV`})}});
 const el={};cards.forEach(c=>{const e=elOf(c);el[e.id]=el[e.id]||{e,c:0};el[e.id].c++});Object.values(el).forEach(x=>{if(x.c>=3){const b=x.c>=4?25:15;atk+=b/2;spd+=x.c>=4?6:4;out.push({ic:x.e.ic,t:`Résonance ${x.e.name} ×${x.c}`,d:`+${b/2} % ATQ, +${x.c>=4?6:4} VIT`})}});
 const cl=new Set(cards.map(c=>clsOf(c).id));if(cl.has("tnk")&&cl.has("hea")&&cl.size>=4){hp+=12;out.push({ic:"🛡️",t:"Formation équilibrée",d:"+12 % PV (tank + soigneur + 4 classes)"})}
 return{list:out,atk,hp,spd,maxSeries:Math.max(0,...Object.values(ser).map(s=>s.c))}}
function synHTML(cards){const s=synergies(cards);return`<div class="box"><b>🔗 Synergies</b><div class="muted" style="font-size:12px;margin:2px 0 6px">Mets des persos du même anime, du même élément ou une équipe équilibrée pour des bonus.</div>${s.list.length?s.list.map(x=>`<div class="syn"><span>${x.ic} <b>${esc(x.t)}</b></span><span>${x.d}</span></div>`).join(""):'<div class="muted" style="font-size:12.5px">Aucune synergie active.<br>📺 2+ persos du même anime : +10 % par perso · 🔥 3+ du même élément · 🛡️ tank + soigneur + 4 classes</div>'}</div>`}

const ARANK=[{n:"Bronze",p:0,ic:"🥉",c:"#cd7f32"},{n:"Argent",p:1000,ic:"🥈",c:"#c0c8d8"},{n:"Or",p:1250,ic:"🥇",c:"#ffd34d"},{n:"Platine",p:1500,ic:"💠",c:"#7fe3ff"},{n:"Diamant",p:1750,ic:"💎",c:"#4da3ff"},{n:"Maître",p:2000,ic:"🔮",c:"#b45cff"},{n:"Légende",p:2300,ic:"👑",c:"#ff3d6e"}];

const ATIX=5;
function weekId(){return Math.floor((Date.now()-Date.UTC(2026,0,5))/(7*86400000))}
function arank(p){let r=ARANK[0];ARANK.forEach(x=>{if(p>=x.p)r=x});return r}
function arenaState(){const d=today(),wk=weekId();if(!S.arena)S.arena={pts:800,best:800,wkBest:800,wk,day:d,used:0,opp:null,hist:[],w:0,l:0,reached:{}};const A=S.arena;
 if(A.wk!==wk){const r=ARANK.indexOf(arank(A.wkBest));addGift(arank(A.wkBest).ic,"Arène : récompense de la semaine","Ton meilleur rang cette semaine : "+arank(A.wkBest).n+".",AWEEK[r]);A.pts=Math.max(800,Math.round(800+(A.pts-800)*.6));A.wkBest=A.pts;A.wk=wk;A.opp=null}
 if(A.day!==d){A.day=d;A.used=0}return A}
async function arenaPool(){const pages=Object.keys(pageCache).map(Number).filter(p=>pageCache[p]&&pageCache[p].length);if(DEMO||!pages.length){try{await fetchPage(1);await fetchPage(2)}catch(_){}}
 const all=[];(DEMO?[1,2,3,4,5,6].map(p=>demoPage(p).map((c,i)=>Object.assign({},c,{rank:(p-1)*50+i+1}))).flat():Object.keys(pageCache).map(Number).map(p=>(pageCache[p]||[]).map((c,i)=>Object.assign({},c,{rank:(p-1)*50+i+1}))).flat()).forEach(c=>{if(c&&c.img&&!c.adult){const r=rarOfRank(c.rank);if(r)all.push(Object.assign(c,{rarity:r.id}))}});return all}
async function arenaOpp(){const A=arenaState();if(A.opp)return A.opp;const pool=await arenaPool();const r=rng((Date.now()%999999)+A.pts);const tr=ARANK.indexOf(arank(A.pts));
