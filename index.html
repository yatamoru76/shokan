<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shōkan · 召喚</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d1a;--bg2:#1a1630;--card:#221c3d;--ink:#f4f1ff;--muted:#a49cc4;--line:#3a3260;--C:#9aa4b1;--R:#3b9cff;--E:#b45cff;--L:#ffb020;--M:#ff3d6e;--acc:#ff3d6e;--ok:#3bff9c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:inherit}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,sans-serif;overflow:hidden}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:radial-gradient(circle at 50% -10%,#3a1f6e 0,transparent 60%),var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;gap:6px}
.logo{font-weight:900;font-size:18px;letter-spacing:.02em;white-space:nowrap}
.logo span{color:var(--acc)}
.res{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:6px 12px 14px}
nav{display:flex;border-top:1px solid #2c2550;background:#141126}
nav button{flex:1;background:none;border:0;color:var(--muted);font-weight:700;font-size:10.5px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button .i{font-size:19px}
nav button.on{color:var(--ink)}
nav .dot{position:absolute;top:6px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--acc);display:none}
h2{margin:8px 0 6px;font-size:18px}h3{margin:14px 0 6px;font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:900;font-size:15px;color:#fff;background:linear-gradient(135deg,#ff3d6e,#b45cff);box-shadow:0 6px 20px #ff3d6e44}
.btn:disabled{background:#3a3260;box-shadow:none;color:#8d84ad}
.btn.ghost{background:var(--bg2);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:8px 10px;font-size:13px;border-radius:10px}
.btn.gold{background:linear-gradient(135deg,#ffb020,#ff6a3d)}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.muted{color:var(--muted);font-size:13px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
/* Pack */
.packWrap{display:flex;justify-content:center;padding:10px 0 6px;perspective:800px}
.pack{width:170px;height:240px;border-radius:16px;position:relative;cursor:pointer;background:linear-gradient(160deg,#ff3d6e,#7b2cff 55%,#1fb7ff);box-shadow:0 0 40px #b45cff66,inset 0 0 0 3px #ffffff33;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:float 3s ease-in-out infinite}
.pack::before{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,#ffffff55 50%,transparent 60%);animation:shine 3s linear infinite}
.pack .t1{font-weight:900;font-size:26px;line-height:.95;text-align:center;text-shadow:0 3px 0 #0005;z-index:1}
.pack .t2{font-size:11px;font-weight:700;letter-spacing:.2em;margin-top:8px;opacity:.85;z-index:1}
.pack .kanji{position:absolute;font-size:140px;opacity:.12;font-weight:900}
.pack.shake{animation:shake .5s ease-in-out infinite}.pack.burst{animation:burst .45s ease-in forwards}
@keyframes float{50%{transform:translateY(-8px) rotateY(8deg)}}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) scale(1.03)}75%{transform:rotate(4deg) scale(1.03)}}
@keyframes burst{to{transform:scale(1.6);opacity:0;filter:brightness(3)}}
.event{background:linear-gradient(135deg,#3a1f6e,#1f2b6e);border:1px solid #6a4cff;border-radius:14px;padding:9px 12px;font-size:13px;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.stat{background:var(--bg2);border-radius:12px;padding:7px 3px;text-align:center;font-size:10.5px;color:var(--muted)}
.stat b{display:block;font-size:16px;color:var(--ink)}
.odds div{display:flex;justify-content:space-between;padding:2px 0;font-size:13px}
/* Cards */
.card{position:relative;aspect-ratio:2.5/3.6;border-radius:12px;overflow:hidden;background:var(--card);border:3px solid var(--rc,#555);box-shadow:0 4px 14px #0007}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .ov{position:absolute;left:0;right:0;bottom:0;padding:16px 5px 4px;background:linear-gradient(transparent,#000d 40%)}
.card .nm{font-weight:700;font-size:11.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sr{font-size:9px;color:#d5cff0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .stars{font-size:9px;color:#ffd34d;letter-spacing:-1px}
.card .rb{position:absolute;top:4px;left:4px;background:var(--rc);color:#fff;font-size:8.5px;font-weight:900;padding:2px 5px;border-radius:6px;text-transform:uppercase}
.card .ce{position:absolute;top:4px;right:4px;background:#000b;font-size:10px;padding:1px 4px;border-radius:6px}
.card .cnt{position:absolute;top:22px;right:4px;background:#000b;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:6px}
.card .lv{position:absolute;top:22px;left:4px;background:#000b;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:6px}
.card .tm{position:absolute;inset:0;border:3px solid var(--ok);border-radius:9px;pointer-events:none}
.card.E::after,.card.L::after,.card.M::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff40 45%,#ffffff10 55%,transparent 70%);background-size:250% 100%;animation:holo 2.5s linear infinite;mix-blend-mode:screen;pointer-events:none}
.card.M{border-color:transparent;background:conic-gradient(#ff3d6e,#ffb020,#3bff9c,#3b9cff,#b45cff,#ff3d6e) border-box}
.card.awk{box-shadow:0 0 16px #ffd34d,0 0 4px #fff}
.card.awk::before{content:"覚醒";position:absolute;bottom:34px;right:4px;font-size:10px;font-weight:900;color:#ffd34d;text-shadow:0 0 6px #ff6a00;z-index:2}
@keyframes holo{from{background-position:150% 0}to{background-position:-100% 0}}
.C{--rc:var(--C)}.R{--rc:var(--R)}.E{--rc:var(--E)}.L{--rc:var(--L)}.M{--rc:var(--M)}
/* Reveal */
.ovl{position:absolute;inset:0;z-index:20;background:#0b0915f2;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
#revealGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%;max-width:420px}
.flip{width:30%;perspective:900px;cursor:pointer;animation:deal .4s backwards;position:relative}
@keyframes deal{from{transform:translateY(80px) scale(.6);opacity:0}}
.flip .inner{position:relative;width:100%;aspect-ratio:2.5/3.6;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.open .inner{transform:rotateY(180deg)}
.flip .back,.flip .front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.flip .back{border-radius:12px;background:repeating-linear-gradient(45deg,#2a1f55 0 10px,#22194a 10px 20px);border:3px solid #5a4a9a;display:flex;align-items:center;justify-content:center;font-size:30px}
.flip.glowE .back{box-shadow:0 0 18px var(--E)}.flip.glowL .back{box-shadow:0 0 24px var(--L);animation:pulse 1s infinite}.flip.glowM .back{box-shadow:0 0 30px var(--M);animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.new{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06281a;font-size:10px;font-weight:900;padding:2px 7px;border-radius:6px;z-index:3;display:none}
.flip.open .new{display:block}
.burstfx{position:absolute;pointer-events:none;width:12px;height:12px;border-radius:50%;animation:spark .8s ease-out forwards;z-index:60}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
/* Collection */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:99px;padding:6px 11px;font-weight:700;font-size:12px}
.filters button.on{background:var(--ink);color:var(--bg)}
input[type=search]{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:14px;margin-bottom:8px;user-select:text}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#detail{z-index:25;justify-content:flex-start;overflow-y:auto;padding-top:20px}
#detail .card{width:190px;flex:none}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:360px;margin-top:10px}
.statgrid div{background:var(--bg2);border-radius:10px;padding:6px;text-align:center;font-size:10.5px;color:var(--muted)}
.statgrid b{display:block;color:var(--ink);font-size:14px}
.xpbar{height:8px;background:#2c2550;border-radius:99px;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#3bff9c,#3b9cff)}
/* Team */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:2.5/3.6;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;position:relative}
.slot .card{position:absolute;inset:-2px}
.slot .ce,.slot .sr,.slot .rb{display:none}.slot .nm{font-size:9px}.slot .lv{top:4px}
.power{font-size:22px;font-weight:900;text-align:center;margin:8px 0 2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
/* Aventure */
.world{border-radius:16px;padding:12px;margin-bottom:10px;position:relative;overflow:hidden;border:1px solid #ffffff22}
.world .wt{font-weight:900;font-size:16px}
.world.lock{filter:grayscale(1);opacity:.5}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.stg{background:#0008;border:1px solid #ffffff33;border-radius:10px;padding:6px 2px;text-align:center;font-weight:900;font-size:13px;cursor:pointer}
.stg small{display:block;font-size:9px;color:#ffd34d;font-weight:700;min-height:11px}
.stg.lock{opacity:.35;cursor:default}.stg.boss{border-color:#ffd34d}
.stg.cur{box-shadow:0 0 0 2px var(--ok)}
.quest{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px;margin-top:8px}
.quest .q{flex:1;font-size:13px}
/* Battle */
#battle{z-index:30;padding:10px;justify-content:space-between;background:radial-gradient(circle at 50% 40%,#2a1d55,#0b0915)}
.bside{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%}
.unit{width:62px;text-align:center;position:relative;transition:transform .15s,opacity .4s}
.unit .av{width:58px;height:58px;border-radius:50%;margin:0 auto;border:3px solid var(--uc,#888);overflow:hidden;background:#221c3d;display:flex;align-items:center;justify-content:center;font-size:34px}
.unit.boss .av{width:76px;height:76px;font-size:48px}
.unit.boss{width:80px}
.unit .av img{width:100%;height:100%;object-fit:cover;object-position:top}
.unit .hp{height:6px;background:#2c2550;border-radius:99px;overflow:hidden;margin-top:3px}
.unit .hp i{display:block;height:100%;background:var(--ok);transition:width .25s}
.unit .en{height:4px;background:#2c2550;border-radius:99px;overflow:hidden;margin-top:2px}
.unit .en i{display:block;height:100%;background:#ffd34d;transition:width .25s}
.unit .un{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.unit .sh{position:absolute;top:0;left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;box-shadow:0 0 0 3px #6ad8ff,0 0 12px #6ad8ff;display:none}
.unit.dead{opacity:.25;filter:grayscale(1)}
.unit.act{transform:scale(1.15)}
.unit.hit{animation:hit .25s}
@keyframes hit{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.dmg{position:absolute;left:50%;top:10px;font-weight:900;font-size:16px;pointer-events:none;animation:dmg .9s ease-out forwards;text-shadow:0 2px 0 #000;z-index:5;white-space:nowrap}
@keyframes dmg{from{transform:translate(-50%,0) scale(1.3)}to{transform:translate(-50%,-40px);opacity:0}}
#blog{font-size:12.5px;color:#d9d2f5;min-height:36px;text-align:center;padding:4px}
#bhead{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:13px;font-weight:700}
.vs{font-weight:900;font-size:22px;color:var(--acc);text-align:center;margin:4px 0}
#bctrl{display:flex;gap:6px;width:100%}
#bctrl button{flex:1}
.ult{position:absolute;left:0;right:0;top:45%;text-align:center;font-weight:900;font-size:24px;color:#ffd34d;text-shadow:0 0 14px #ff6a00;pointer-events:none;animation:ult 1s forwards;z-index:10}
@keyframes ult{from{transform:scale(2);opacity:0}20%{transform:scale(1);opacity:1}to{opacity:0}}
#toast{position:absolute;top:10px;left:50%;transform:translate(-50%,-150%);background:#fff;color:#111;padding:9px 14px;border-radius:12px;font-weight:700;font-size:13px;z-index:70;transition:transform .3s;max-width:92%;text-align:center}
#toast.show{transform:translate(-50%,0)}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.5}
.foot a{color:var(--muted)}
.err{background:#3a1222;border:1px solid #ff3d6e;border-radius:12px;padding:10px;font-size:13px;margin-top:10px;display:none}
#demoBanner{display:none;margin:0 12px 4px;background:#2a2150;border:1px solid #b45cff;border-radius:12px;padding:7px 10px;font-size:11.5px;color:#d9d2f5}
#modal{z-index:50}
#modal .mbox{background:#1d1838;border:1px solid var(--line);border-radius:18px;padding:18px;max-width:340px;width:100%;text-align:center}

/* ===== THÈME MODERNE ===== */
:root{--bg:#09090c;--bg2:#141419;--card:#18181f;--ink:#f4f4f6;--muted:#8a8a99;--line:#26262f;--C:#8e9aaf;--R:#4da3ff;--E:#a970ff;--L:#ffb547;--M:#ff4d6d;--acc:#ff4d2e;--ok:#34d399}
html,body{font-family:"Inter","Noto Sans JP",system-ui,sans-serif;letter-spacing:-.005em}
.jpf{font-family:"Noto Sans JP",sans-serif}
#app{background:radial-gradient(120% 55% at 50% -18%,#2b100b 0,transparent 60%),var(--bg)}
header{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.02em}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP";font-weight:900;font-size:17px;color:#fff;box-shadow:0 6px 18px -4px #ff4d2eaa}
.logo span{color:var(--ink)}.logo small{color:var(--muted);font-weight:600;font-size:15px}
.chip{background:var(--bg2);border:1px solid var(--line);padding:3px 8px;font-weight:600;font-size:11.5px}
main{padding:4px 14px 16px}
nav{margin:0 10px 10px;border:1px solid var(--line);border-radius:20px;background:#121217ee;backdrop-filter:blur(14px)}
nav button{font-weight:600;font-size:10px;padding:9px 0 9px;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
nav button.on::before{content:"";position:absolute;top:-1px;left:32%;right:32%;height:2px;background:var(--acc);border-radius:2px;box-shadow:0 0 10px var(--acc)}
nav .dot{top:7px;right:30%;background:var(--acc);box-shadow:0 0 0 2px #121217}
.btn{background:var(--acc);box-shadow:0 10px 26px -10px #ff4d2ecc;border-radius:12px;font-weight:800}
.btn.ghost{background:var(--bg2);border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#ffb547,#ff4d2e)}
.btn:disabled{background:#17171c;color:#55555f;border:1px solid var(--line);box-shadow:none}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.event{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:14px;padding:10px 12px}
.event b{color:var(--ink)}
.sec{display:flex;align-items:baseline;gap:8px;margin:16px 2px 9px}
.sec .no{font-family:"Noto Sans JP";color:var(--acc);font-weight:900;font-size:12px}
.sec .t{font-weight:800;font-size:18px;letter-spacing:-.02em}
.sec .jp{color:var(--muted);font-size:11px;font-family:"Noto Sans JP";font-weight:700;margin-left:auto}
.packWrap{padding:0}
.pack{width:100%;height:auto;min-height:150px;flex-direction:row;align-items:stretch;justify-content:flex-start;border-radius:18px;background:var(--bg2);border:1px solid var(--line);box-shadow:none;animation:none;overflow:hidden}
.pack::before{display:none}
.pack .art{width:120px;flex:none;position:relative;background:radial-gradient(circle at 30% 20%,#ff8a5c,#ff4d2e 40%,#7a1408);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pack .art::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,#ffffff55 50%,transparent 58%);animation:shine 3.2s linear infinite}
.pack .kj{font-family:"Noto Sans JP";font-weight:900;font-size:78px;color:#fff;text-shadow:0 6px 20px #0006;line-height:1}
.pack .inf{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pack .bn{font-weight:800;font-size:19px;letter-spacing:-.02em}
.pack .tags{display:flex;flex-wrap:wrap;gap:5px}
.pack .tag{font-size:10.5px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}
.pack .tag.a{border-color:#ff4d2e66;color:#ff8a6c}
.pack.shake{animation:shake2 .45s ease-in-out infinite}
@keyframes shake2{0%,100%{transform:none}25%{transform:translateX(-4px) rotate(-1deg)}75%{transform:translateX(4px) rotate(1deg)}}
.stats{gap:6px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;font-size:10px}
.oddrow{display:grid;grid-template-columns:90px 1fr 46px;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.oddrow .bar{height:6px;background:#22222a;border-radius:99px;overflow:hidden}.oddrow .bar i{display:block;height:100%;border-radius:99px}
.card{border-width:2px;border-radius:12px}
.card .rb{font-size:7.5px;letter-spacing:.08em;border-radius:4px;padding:2px 5px}
.card .ce,.card .cnt,.card .lv{background:#000000c8;border-radius:5px}
.filters button{background:var(--bg2);border-color:var(--line);font-weight:600}
.filters button.on{background:var(--acc);border-color:var(--acc);color:#fff}
input[type=search]{background:var(--bg2);border-color:var(--line);border-radius:12px}
.ovl{background:#09090cf2}
#modal .mbox{background:var(--bg2);border:1px solid var(--line);border-radius:20px}
#battle{background:radial-gradient(circle at 50% 42%,#2a120c,#09090c 70%)}
.vs{color:var(--acc);font-family:"Noto Sans JP"}
.world{border:1px solid #ffffff1a;border-radius:18px}
.world::after{content:attr(data-kj);position:absolute;right:-4px;top:-16px;font-size:96px;font-family:"Noto Sans JP";font-weight:900;opacity:.14;pointer-events:none}
.world .wt{font-size:17px;letter-spacing:-.02em}
.stg{background:#00000059;backdrop-filter:blur(4px);border-color:#ffffff26;border-radius:10px}
.quest{background:var(--bg2);border-color:var(--line);border-radius:14px}
.statgrid div{background:var(--bg2);border:1px solid var(--line)}
.slot{border-color:var(--line);background:var(--bg2)}
.power{font-weight:900;letter-spacing:-.02em}
#demoBanner{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--E)}
.foot{color:#5c5c6a}

/* ===== PILE DE CARTES ===== */
#stack{position:relative;width:min(64vw,250px);aspect-ratio:2.5/3.6;margin:6px auto 0}
.sc{position:absolute;inset:0;touch-action:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;cursor:grab}
.sc .inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.sc.flipped .inner{transform:rotateY(180deg)}
.sc .back,.sc .front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sc .front{transform:rotateY(180deg)}
.sc .back{border-radius:14px;background:radial-gradient(circle at 50% 35%,#3a1510,#120808 70%);border:2px solid #ff4d2e88;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP";font-size:90px;font-weight:900;color:#ff4d2e33}
.sc.glowE .back{box-shadow:0 0 34px var(--E);border-color:var(--E)}
.sc.glowL .back{box-shadow:0 0 44px var(--L);border-color:var(--L);animation:pulse 1s infinite}
.sc.glowM .back{box-shadow:0 0 56px var(--M);border-color:var(--M);animation:pulse .55s infinite}
.sc .card{height:100%;border-radius:14px}
.sc *{pointer-events:none}.card img{-webkit-user-drag:none;user-drag:none}
.sc .card .nm{font-size:16px}.sc .card .sr{font-size:11.5px}.sc .card .rb{font-size:10px;padding:3px 7px}.sc .card .ce{font-size:14px}.sc .card .stars{font-size:12px}

@keyframes glitch{0%{transform:rotateY(180deg) translate(3px,-2px) skewX(5deg);filter:hue-rotate(120deg) saturate(3)}100%{transform:rotateY(180deg) translate(-4px,3px) skewX(-5deg);filter:hue-rotate(-120deg) brightness(1.8)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}

@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.fob{position:absolute;top:12%;left:0;right:0;text-align:center;font-family:"Noto Sans JP";font-weight:900;font-size:36px;color:#fff;text-shadow:0 0 18px var(--M),0 0 40px var(--L);animation:fob 2.2s forwards;z-index:41;pointer-events:none;line-height:1.1}
.fob small{display:block;font-size:15px;color:#ffd34d}
@keyframes fob{0%{transform:scale(3) rotate(-8deg);opacity:0}15%{transform:scale(1) rotate(-3deg);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(1.1) rotate(-3deg)}}
#rcount{color:var(--muted);font-size:12px;font-weight:700;margin-top:18px;text-align:center}
#rhint{color:var(--muted);font-size:12px;text-align:center;margin-top:4px}
#revealGrid .card{width:100%}
.sumc{width:30%;position:relative}
.sumc .new{display:block}
#cMusic{cursor:pointer}

/* ===== OUVERTURE DU BOOSTER ===== */
#opener{z-index:22;background:radial-gradient(circle at 50% 45%,#2b100b,#09090cf5 70%)}

@keyframes hintb{50%{transform:translateX(10px)}}
#pkwrap{perspective:900px}
#pk{--W:220px;--H:330px;--lid:58px;width:var(--W);height:var(--H);position:relative;touch-action:none;cursor:grab;transform-style:preserve-3d;will-change:transform}
#pk.drop{transition:transform .38s ease-in,opacity .38s;transform:translateY(420px) rotate(8deg)!important;opacity:0}
.pk-body,.pk-lid{position:absolute;left:0;right:0;background:radial-gradient(circle at 70% 18%,#ffb08a 0,transparent 30%),linear-gradient(160deg,#ff6a3d,#ff4d2e 35%,#a3170a 75%,#4a0904);background-size:100% var(--H);overflow:hidden}
.pk-body{top:var(--lid);bottom:0;background-position:0 calc(-1*var(--lid));border-radius:0 0 14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 30px 60px -20px #000c}
.pk-lid{top:0;height:var(--lid);border-radius:14px 14px 0 0;background-position:0 0;transform-origin:100% 100%;z-index:3}
.pk-body .kj{position:absolute;font-family:"Noto Sans JP";font-weight:900;font-size:170px;color:#fff;opacity:.13;top:10px}
.pk-body .t1{font-weight:900;font-size:34px;line-height:.95;text-align:center;color:#fff;text-shadow:0 4px 0 #0004;z-index:1;letter-spacing:-.02em}
.pk-body .t2{font-size:11px;font-weight:700;letter-spacing:.18em;color:#ffe2d8;margin-top:10px;z-index:1}
.foil{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff55 45%,#ffe4a8 50%,#ffffff40 55%,transparent 70%);background-size:300% 300%;mix-blend-mode:overlay;pointer-events:none}
.crimp{position:absolute;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,#0003 0 4px,#fff2 4px 8px)}
.crimp.t{top:0}.crimp.b{bottom:0}
.pk-line{position:absolute;left:6px;right:6px;bottom:0;border-bottom:2px dashed #ffffffaa}
.tear{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.pk-glow{position:absolute;left:-10px;right:-10px;top:calc(var(--lid) - 30px);height:60px;background:radial-gradient(ellipse at 50% 50%,#fff 0,#ffe7a8 25%,transparent 70%);opacity:0;z-index:5;pointer-events:none;filter:blur(2px)}
#opwait{display:none;color:var(--muted);font-size:13px;margin-top:16px}
#pk *{pointer-events:none}
/* ===== DÉCOR DE L'UNIVERS (fiche) ===== */
#detail{background:var(--bg)}
.dbg{position:absolute;left:0;right:0;top:0;height:420px;background-size:cover;background-position:center;opacity:0;transition:opacity .8s;animation:kb 22s ease-in-out infinite alternate;z-index:0}
.dbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#09090c55 0,#09090c88 45%,var(--bg) 100%)}
@keyframes kb{from{transform:scale(1.12) translateX(-2%)}to{transform:scale(1) translateX(2%)}}
#detail>*:not(.dbg){position:relative;z-index:1}
.dsrc{font-size:10.5px;color:#ffffffaa;margin-top:2px}

/* ===== RARETÉS DIVIN & COSMOS ===== */
:root{--D:#ffd96a;--X:#9b86ff}
.D{--rc:var(--D)}.X{--rc:var(--X)}
.stats{grid-template-columns:repeat(4,1fr)!important}
.card.D{border-color:transparent;background:linear-gradient(135deg,#fff8d6,#ffd34d 30%,#fff 50%,#ffb547 70%,#fff3b0) border-box;box-shadow:0 0 18px #ffd96a88}
.card.D .rb{background:linear-gradient(90deg,#fff3b0,#ffd34d);color:#4a3200}
.card.X{border-color:transparent;background:linear-gradient(120deg,#7b5cff,#00e5ff,#ff4dd8,#7b5cff) border-box;background-size:300% 300%;animation:cos 4s linear infinite;box-shadow:0 0 22px #7b5cffaa}
@keyframes cos{to{background-position:300% 0}}
.card.X .rb{background:linear-gradient(90deg,#7b5cff,#00e5ff,#ff4dd8);color:#fff}
.card.D::after,.card.X::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background-size:250% 100%;animation:holo 2.2s linear infinite}
.card.D::after{background-image:linear-gradient(115deg,transparent 30%,#fff6c980 45%,#ffffff30 55%,transparent 70%)}
.card.X::after{background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 12%,#fff,transparent),radial-gradient(1.4px 1.4px at 40% 44%,#fff,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1.2px 1.2px at 25% 70%,#fff,transparent),linear-gradient(115deg,transparent 30%,#9b86ff70 45%,#00e5ff40 55%,transparent 70%);background-size:100% 100%,100% 100%,100% 100%,100% 100%,100% 100%,250% 100%}
.sc.glowD .back{box-shadow:0 0 70px var(--D),0 0 20px #fff;border-color:var(--D);animation:pulse .45s infinite}
.sc.glowX .back{box-shadow:0 0 90px #7b5cff,0 0 40px #00e5ff;border-color:#00e5ff;animation:pulse .32s infinite,hue 2s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.fobD{text-shadow:0 0 18px #ffd96a,0 0 40px #fff6c9;color:#fff8d6}
.fobX{background:linear-gradient(90deg,#9b86ff,#00e5ff,#ff4dd8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px #7b5cff)}

header .res{flex-wrap:nowrap;gap:3px}
header .chip{padding:3px 6px;font-size:11px}
@media (max-width:430px){.logo small{display:none}}

/* ===== MARCHÉ ===== */
#picker{z-index:26;justify-content:flex-start;overflow-y:auto}
.subtabs{display:flex;gap:6px;margin-bottom:10px}
.subtabs button{flex:1;border:1px solid var(--line);background:var(--bg2);color:var(--muted);border-radius:12px;padding:8px 0;font-weight:700;font-size:12.5px;position:relative}

.lst{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}

.trade{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}

.trade .side{flex:1;text-align:center;font-size:11.5px}
.trade .side .card{width:80px;margin:4px auto}

.vb{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;display:inline-block}

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:420px}

/* ===== FICHE : navigation + fonds animés ===== */
#detail>*:not(.dbg):not(.fx):not(.rays):not(.neb){position:relative;z-index:2}
.fx{position:absolute;left:0;top:0;width:100%;height:420px;pointer-events:none;z-index:1}
.rays{position:absolute;left:50%;top:-180px;width:900px;height:900px;margin-left:-450px;pointer-events:none;z-index:1;opacity:.35;mix-blend-mode:screen;
 background:repeating-conic-gradient(from 0deg,#ffe9a066 0deg 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spinr 40s linear infinite}

.neb{position:absolute;left:0;right:0;top:0;height:420px;pointer-events:none;z-index:1;mix-blend-mode:screen;opacity:.55;
 background:radial-gradient(ellipse at 20% 30%,#7b5cff88,transparent 55%),radial-gradient(ellipse at 80% 20%,#00e5ff66,transparent 50%),radial-gradient(ellipse at 60% 70%,#ff4dd866,transparent 55%);animation:neb 9s ease-in-out infinite alternate}
@keyframes neb{0%{filter:hue-rotate(0deg);transform:scale(1)}100%{filter:hue-rotate(70deg);transform:scale(1.15) translateX(-4%)}}
.dcw{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:380px}

@keyframes inR{from{transform:translateX(110%) rotate(8deg);opacity:0}}
@keyframes inL{from{transform:translateX(-110%) rotate(-8deg);opacity:0}}

.dnav{font-size:11.5px;color:#ffffffaa;margin-top:8px}
/* le décor bouge plus vite pour les hautes raretés */
.dbg.hi{animation-duration:9s}

/* ===== COMBATS v2 ===== */
#battle{padding:10px 8px;justify-content:space-between;overflow:hidden}
#bbg{position:absolute;inset:0;z-index:-1;opacity:.9}
#bbg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 0,#09090ccc 75%)}
#bhead{font-weight:800}
#bmid{min-height:44px;display:flex;align-items:center;justify-content:center}
#blog{font-size:12.5px;color:#e8e2ff;background:#0009;border:1px solid #ffffff1a;border-radius:99px;padding:6px 14px;min-height:0;max-width:94%}
.bside{gap:8px}
.bu{width:64px;text-align:center;position:relative;transition:opacity .5s,filter .5s,transform .5s}
.bu.boss{width:86px}.bu.titan{width:120px}
.bcard{position:relative;aspect-ratio:2.5/3.5;border-radius:9px;overflow:hidden;border:2px solid var(--rc,#666);background:#18181f;box-shadow:0 6px 16px #0009}
.bcard img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;pointer-events:none}
.bcard.M,.bcard.D,.bcard.X{box-shadow:0 0 14px var(--rc)}
.bel{position:absolute;top:2px;right:2px;font-size:10px;background:#000a;border-radius:5px;padding:0 3px}
.bsh{position:absolute;inset:0;border-radius:7px;box-shadow:inset 0 0 0 3px #6ad8ff,inset 0 0 18px #6ad8ffaa;opacity:0;transition:opacity .2s}
.btaunt{position:absolute;top:2px;left:3px;font-weight:900;color:#ff8a5c;font-size:14px;text-shadow:0 0 6px #000;opacity:0}

@keyframes enf{to{background-position:-200% 0}}
.bnm{font-size:9px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d9d2f5}
.bu.act .bcard{box-shadow:0 0 0 2px #fff,0 0 18px var(--uc)}
.bu.hit .bcard{animation:bhit .28s}
@keyframes bhit{0%{filter:brightness(3)}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}100%{filter:none;transform:none}}
.bu.dead{opacity:.28;filter:grayscale(1);transform:translateY(8px) rotate(-4deg) scale(.94)}
.dmg{position:absolute;left:50%;top:14px;font-weight:900;font-size:15px;pointer-events:none;animation:dmg 1s ease-out forwards;text-shadow:0 2px 0 #000,0 0 6px #000;z-index:6;white-space:nowrap}
.dmg.big{font-size:21px}

.techl{position:absolute;left:50%;top:-20px;transform:translateX(-50%);background:#000c;border:1px solid var(--uc);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap;z-index:7;animation:techl 1.1s ease-out forwards}
@keyframes techl{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.slash{position:absolute;left:-30%;top:50%;width:160%;height:3px;background:linear-gradient(90deg,transparent,#fff,var(--sc),transparent);box-shadow:0 0 10px var(--sc);transform:rotate(var(--rot)) scaleX(0);animation:slash .32s ease-out forwards;z-index:4}

.boom{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:3px solid var(--oc);animation:boom .45s ease-out forwards;z-index:8;pointer-events:none}

.healfx{position:absolute;inset:0;background:radial-gradient(circle at 50% 100%,#3bff9c88,transparent 70%);animation:heal .8s ease-out forwards;z-index:4}
@keyframes heal{0%{opacity:0;transform:translateY(20%)}40%{opacity:1}100%{opacity:0;transform:translateY(-20%)}}
#bfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
#bflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25}
#bflash.on{animation:flash .45s}
/* cinématique d'ultime */
#cine{position:absolute;inset:0;z-index:22;display:none;overflow:hidden;pointer-events:none;--cc:#ff4d2e}

#cine[data-r="D"]{--cc:#ffd96a!important}
#cine[data-r="X"] .cstars{opacity:1;background-image:radial-gradient(1.5px 1.5px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 15%,#cfe,transparent),radial-gradient(1px 1px at 75% 55%,#fff,transparent),radial-gradient(2px 2px at 88% 30%,#fff,transparent),radial-gradient(1px 1px at 45% 85%,#fff,transparent),radial-gradient(ellipse at 30% 40%,#7b5cff66,transparent 50%),radial-gradient(ellipse at 70% 60%,#00e5ff44,transparent 50%);animation:cfade var(--cd,1.5s) forwards,hue 2s linear infinite}

#cine[data-r="X"] .cname span{background:linear-gradient(90deg,#9b86ff,#00e5ff,#ff4dd8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 10px #7b5cff)}
#cine[data-r="D"] .cname span{color:#fff8d6;text-shadow:0 0 18px #ffd96a,0 0 40px #fff6c9}
#cine .cname span{font-size:24px;max-width:92%}
/* aperçu des adversaires */
.foes{display:flex;justify-content:center;gap:6px;margin:10px 0}
.ft{width:46px}.ft.boss{width:62px}
.ft .card .ov,.ft .card .ce,.ft .card .lv,.ft .card .cnt{display:none}.ft .card .rb{font-size:5.5px;padding:1px 3px}

/* ===== SCÈNE ANIMÉE ===== */
.dvid{position:absolute;left:0;right:0;top:0;height:420px;overflow:hidden;z-index:0;opacity:0;transition:opacity 1.2s;pointer-events:none}
.dvid.on{opacity:1}
.dvid iframe{position:absolute;left:50%;top:50%;width:760px;height:428px;transform:translate(-50%,-50%) scale(1.25);border:0;pointer-events:none}
.dvid::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#09090c66 0,#09090c55 40%,var(--bg) 100%)}
#detail>.dvid{position:absolute!important;z-index:0!important}
.scbtn{position:absolute!important;top:12px;right:12px;z-index:5!important;border:1px solid #ffffff33;background:#0009;backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:5px 10px}

/* ===== notifications, multi-ouverture ===== */
#cBell{position:relative;cursor:pointer}
.bdg{position:absolute;top:-5px;right:-5px;background:var(--acc);color:#fff;font-size:9px;font-weight:800;border-radius:99px;padding:1px 5px;line-height:1.3}
.ntf{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:6px;font-size:13px}
.ntf.unread{border-color:#ff4d2e66;background:#1d1414}
.ntf .ni{font-size:18px}
.multi{display:flex;align-items:center;gap:6px;margin-top:8px}
.multi .btn{width:auto;flex:1;padding:7px 4px}
.multi .muted{font-size:11.5px;flex:none}
#revealGrid.mgrid{max-height:62vh;overflow-y:auto;gap:6px}
#revealGrid.mgrid .flip{width:18%}
#revealGrid.mgrid .card .ov{display:none}#revealGrid.mgrid .card .ce{display:none}#revealGrid.mgrid .card .rb{font-size:5.5px;padding:1px 3px}
#revealGrid.mgrid .new{font-size:7px;padding:1px 4px;bottom:-5px}
#revealGrid.mgrid .flip .back{font-size:20px;font-family:"Noto Sans JP";color:#ff4d2e55;border-radius:8px}

/* ===== album : cartes verrouillées ===== */
.lk{position:relative;cursor:pointer}
.lk .card{filter:grayscale(1) brightness(.42) contrast(1.05);border-color:#3a3a44!important;box-shadow:none!important;background:#18181f!important}
.lk .card::after,.lk .card::before{display:none!important}
.lk .card .nm,.lk .card .sr{filter:brightness(2.3)}
.lki{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);font-size:22px;filter:drop-shadow(0 2px 4px #000);pointer-events:none}
.lk.big .lki{font-size:38px}
.albstat{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.albh{font-weight:900;font-size:14px;margin:12px 2px 6px}

.misstog{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-weight:700;font-size:13.5px;cursor:pointer}
.sw{width:42px;height:24px;border-radius:99px;background:#2a2a33;position:relative;transition:background .2s;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--acc)}.sw.on i{left:21px}

/* ===== boosters à thème ===== */
.packs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;margin:0 -2px}
.packs::-webkit-scrollbar{display:none}
.pcard{flex:none;width:76px;height:104px;border-radius:12px;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding:6px;border:2px solid transparent;opacity:.75;transition:transform .15s,opacity .15s}
.pcard.on{border-color:#fff;opacity:1;transform:translateY(-3px);box-shadow:0 8px 20px -6px #000}
.pcard .pkj{position:absolute;top:6px;left:0;right:0;text-align:center;font-family:"Noto Sans JP";font-weight:900;font-size:40px;color:#fff;opacity:.9;text-shadow:0 3px 10px #0006}
.pcard .pn{position:relative;font-weight:800;font-size:10.5px;color:#fff;text-align:center;line-height:1.1;text-shadow:0 1px 4px #000a}

/* ===== décors de lieux ===== */
#bbg{background-size:cover!important;background-position:center!important}
#bbg::after{background:linear-gradient(180deg,#09090cbb 0,#09090c33 25%,#09090c22 60%,#09090ccc 100%)!important}
.bpart{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bpart i{position:absolute;top:-5%;display:block}
.bpart.petal i{width:calc(10px*var(--s));height:calc(7px*var(--s));background:#ffc1d9;border-radius:80% 0 80% 0;animation:petal linear infinite;opacity:.85}
@keyframes petal{to{transform:translate(-80px,110vh) rotate(720deg)}}
.bpart.rain i{width:1.5px;height:calc(28px*var(--s));background:linear-gradient(transparent,#9cc8ffaa);animation:rain linear infinite}
@keyframes rain{to{transform:translate(-60px,110vh)}}
.bpart.ember i{top:auto;bottom:-3%;width:calc(4px*var(--s));height:calc(4px*var(--s));border-radius:50%;background:#ffb547;box-shadow:0 0 8px #ff6a1e;animation:ember linear infinite}
@keyframes ember{to{transform:translate(40px,-110vh);opacity:0}}
.bpart.firefly i{top:auto;bottom:10%;width:calc(4px*var(--s));height:calc(4px*var(--s));border-radius:50%;background:#ffe08a;box-shadow:0 0 10px #ffd34d;animation:ffly ease-in-out infinite alternate}
@keyframes ffly{0%{transform:translate(0,0);opacity:.2}50%{opacity:1}100%{transform:translate(40px,-60vh);opacity:.3}}
.bpart.cloud i{width:calc(160px*var(--s));height:calc(50px*var(--s));border-radius:99px;background:#ffffff55;filter:blur(6px);animation:cloud linear infinite;left:-40%!important}
@keyframes cloud{to{transform:translateX(160vw)}}

/* ===== cinématique façon planche de manga ===== */
#cine .chero,#cine .ckj,#cine .cname{display:none}
#cine .mg{position:absolute;left:4%;right:4%;top:9%;bottom:11%;display:grid;grid-template-columns:1fr 1.15fr;grid-template-rows:40% 60%;gap:9px;z-index:3}
#cine .mp{position:relative;overflow:hidden;background:#fff;border:3px solid #111;box-shadow:0 0 0 2px #fff,0 0 24px var(--cc);opacity:0}
#cine .mp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.55) brightness(1.08)}
#cine .p1{clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
#cine .p1 img{object-position:center 18%;transform:scale(2.2);transform-origin:50% 22%}
#cine .p2{clip-path:polygon(6% 0,100% 0,100% 100%,0 100%)}
#cine .p2 img{object-position:center 15%}
#cine .p3{grid-column:1/-1;clip-path:polygon(0 6%,100% 0,100% 100%,0 94%)}
#cine .p3 img{object-position:center 25%;transform:scale(1.15)}
#cine .spd{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg at 50% 50%,#fff0 0deg 3deg,#ffffffd0 3deg 4deg,#fff0 4deg 9deg);-webkit-mask:radial-gradient(circle,transparent 20%,#000 55%);mask:radial-gradient(circle,transparent 20%,#000 55%);animation:spdrot 1.2s linear infinite}
@keyframes spdrot{to{transform:rotate(30deg)}}
#cine .tone{position:absolute;inset:0;background-image:radial-gradient(#000 1.1px,transparent 1.3px);background-size:6px 6px;mix-blend-mode:multiply;opacity:.35}
#cine .ono,#cine .ono2{position:absolute;font-family:"Noto Sans JP";font-weight:900;color:#fff;-webkit-text-stroke:2px #111;paint-order:stroke;text-shadow:3px 3px 0 #111,0 0 14px var(--cc);transform:rotate(-12deg)}
#cine .ono{right:6%;top:8%;font-size:30px;letter-spacing:-2px}
#cine .ono2{left:5%;top:6%;font-size:44px;transform:rotate(-8deg) scale(0);color:var(--cc)}
#cine .bub{position:absolute;right:4%;bottom:7%;max-width:78%;background:#fff;color:#111;padding:16px 22px 18px;clip-path:polygon(0 18%,8% 0,22% 12%,38% 0,52% 10%,68% 0,82% 12%,100% 4%,92% 30%,100% 52%,90% 70%,100% 96%,80% 86%,62% 100%,46% 88%,28% 100%,14% 86%,0 96%,6% 62%,0 42%);filter:drop-shadow(0 0 6px var(--cc));opacity:0;transform:scale(.4)}
#cine .bub small{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#555}
#cine .bub span{display:block;font-size:19px;font-weight:900;font-style:italic;line-height:1.1;letter-spacing:-.01em}
#cine.on .p1{animation:mp1 var(--cd,1.5s) linear forwards}
#cine.on .p2{animation:mp2 var(--cd,1.5s) linear forwards}
#cine.on .p3{animation:mp3 var(--cd,1.5s) linear forwards}
#cine.on .bub{animation:bub var(--cd,1.5s) linear forwards}
#cine.on .ono2{animation:ono var(--cd,1.5s) linear forwards}
@keyframes mp1{0%{opacity:0;transform:translateY(30px) scale(1.15)}12%{opacity:1;transform:none}88%{opacity:1;filter:none}100%{opacity:0;filter:brightness(3)}}
@keyframes mp2{0%,14%{opacity:0;transform:translateY(30px) scale(1.15)}27%{opacity:1;transform:none}88%{opacity:1;filter:none}100%{opacity:0;filter:brightness(3)}}
@keyframes mp3{0%,29%{opacity:0;transform:translateY(30px) scale(1.15)}42%{opacity:1;transform:none}88%{opacity:1;filter:none}100%{opacity:0;filter:brightness(3)}}
@keyframes bub{0%,44%{opacity:0;transform:scale(.4)}54%{opacity:1;transform:scale(1.08)}58%{transform:scale(1)}100%{opacity:1;transform:scale(1)}}
@keyframes ono{0%,50%{transform:rotate(-8deg) scale(0)}58%{transform:rotate(-8deg) scale(1.2)}62%,100%{transform:rotate(-8deg) scale(1)}}
#cine.foe .mp{box-shadow:0 0 0 2px #fff,0 0 24px #ff4d6d}
#cine[data-r="X"] .mp{box-shadow:0 0 0 2px #fff,0 0 30px #7b5cff,0 0 50px #00e5ff}
#cine[data-r="D"] .mp{box-shadow:0 0 0 2px #fff,0 0 30px #ffd96a}
#cine .crays,#cine .cstars{z-index:1}
.mksearch{display:flex;gap:6px;margin-bottom:10px}.mksearch input{flex:1;margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:14px;user-select:text}
#cine .bub em{display:block;font-size:12px;font-weight:700;font-style:italic;color:#333;margin-top:5px;line-height:1.25}

/* ===== cadre MAÎTRISE (or + arc-en-ciel animé) ===== */
.card.master{border-color:transparent!important;background:conic-gradient(from var(--ma,0deg),#ffd34d,#fff6c9,#ff4d6d,#ffb547,#3bff9c,#00e5ff,#9b86ff,#ff4dd8,#ffd34d) border-box!important;animation:mspin 3s linear infinite;box-shadow:0 0 18px #ffd34daa,0 0 34px #9b86ff66!important}
@property --ma{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes mspin{to{--ma:360deg}}
.card.master::before{content:"極"!important;position:absolute;bottom:34px;right:4px;font-family:"Noto Sans JP";font-size:12px;font-weight:900;color:#fff;text-shadow:0 0 6px #ffd34d,0 0 12px #ff4dd8;z-index:2}
.card.master .rb{background:linear-gradient(90deg,#ffd34d,#ff4dd8,#00e5ff)!important;color:#fff}
/* cut-scene */
#mscene{z-index:60;flex-direction:column;gap:14px;background:#000}
#mscene .msbg{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#3a2a00 0,#000 65%);animation:msbg 2.6s ease-out forwards}
@keyframes msbg{0%{opacity:0}60%{opacity:1;filter:none}68%{filter:brightness(3)}100%{opacity:1}}
#mscene .msrays{position:absolute;left:50%;top:42%;width:1000px;height:1000px;margin:-500px 0 0 -500px;background:repeating-conic-gradient(from 0deg,#ffd34d55 0deg 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);animation:spinr 14s linear infinite,msray 2.6s forwards;opacity:0}
@keyframes msray{0%,55%{opacity:0}70%{opacity:1}100%{opacity:.8}}
#mscene .mswrap{position:relative;perspective:900px}
#mscene .mscard{width:190px;animation:mscard 2.6s cubic-bezier(.3,.9,.3,1) forwards}
@keyframes mscard{0%{transform:scale(.3) rotateY(0);opacity:0}20%{opacity:1}55%{transform:scale(1) rotateY(720deg)}62%{transform:scale(1.15) rotateY(720deg)}100%{transform:scale(1) rotateY(720deg)}}
#mscene .mstxt{position:relative;text-align:center;opacity:0;animation:mstxt .6s 1.9s forwards}
@keyframes mstxt{to{opacity:1}}
#mscene .msk{font-family:"Noto Sans JP";font-weight:900;font-size:34px;color:#ffd34d;text-shadow:0 0 18px #ffd34d}
#mscene .mst{font-weight:900;font-size:24px;letter-spacing:.12em;background:linear-gradient(90deg,#ffd34d,#ff4dd8,#00e5ff,#ffd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
#mscene .msn{font-weight:800;font-size:16px;margin-top:2px}
#mscene .msr{color:#ffd34d;font-size:13px;margin-top:8px;font-weight:700}
#mscene .btn{position:relative;transition:opacity .4s}
/* boîte cadeau */
#cGift{position:relative;cursor:pointer}
.gift{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.gic{font-size:26px}.grw{font-weight:800;font-size:13px;margin-top:3px;color:#ffd34d}
/* profil */
#logoBtn{cursor:pointer}
.logo .mk img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:9px}
.logo .mk{overflow:hidden}

.pav{width:76px;height:76px;flex:none;border-radius:18px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP";font-size:34px;font-weight:900;overflow:hidden;border:2px solid #ffffff33;cursor:pointer}
.pav img{width:100%;height:100%;object-fit:cover;object-position:top}
.pname{font-weight:900;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pedit{background:none;border:0;font-size:14px;cursor:pointer;padding:0}
.ptitle{color:#ffb547;font-size:12px;font-weight:700;margin:2px 0 6px}
.plvl{display:flex;align-items:center;gap:8px;font-size:13px}
.pfav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pslot{aspect-ratio:2.5/3.6;border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:24px;text-align:center;padding:6px}

.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.pstats b{display:block;font-size:14px}.pstats span{font-size:10px;color:var(--muted)}

/* ===== cadre royal ===== */
.card.master{border:0!important;background:#111!important;box-shadow:0 0 22px color-mix(in srgb,var(--mgem,#ffd34d) 55%,transparent),0 0 6px #ffd34d!important;animation:none}
.card.master::before{display:none!important}
.card.master .rb{left:50%!important;transform:translateX(-50%);top:auto!important;bottom:2px;opacity:0}
.card.master .ce{top:14px;right:14px}.card.master .lv,.card.master .cnt{top:14px}.card.master .lv{left:14px}
.card.master .ov{padding-bottom:22px!important}
.mframe{position:absolute;inset:0;z-index:4;pointer-events:none}
.mframe svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 3px #0008)}
.mframe::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(115deg,transparent 35%,#ffffff70 48%,transparent 60%);background-size:260% 100%;animation:holo 3.2s linear infinite;mix-blend-mode:overlay}

/* ===== guilde ===== */
.ghead{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 45%,#141419),#141419 75%);border:1px solid color-mix(in srgb,var(--gc) 50%,transparent)}

.gem2.big{width:64px;height:64px;font-size:36px;border-radius:16px}
.gname{font-weight:900;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.gstats div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}.gstats b{display:block;font-size:14px}.gstats span{font-size:10px;color:var(--muted)}
.gl{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}

.pickrow{display:flex;flex-wrap:wrap;gap:6px}
.pickrow button{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);font-family:"Noto Sans JP";font-weight:900;font-size:18px}

/* décorations appliquées */

.pcard2.bn-bn_dawn{background:linear-gradient(135deg,#ff8a5c,#ff4d6d 45%,#5a1a6e)!important}

/* ===== mode histoire ===== */

.sbart{width:56px;height:70px;flex:none}.sbart svg{width:100%;height:100%}
.sbk{font-family:"Noto Sans JP";font-size:10px;font-weight:900;letter-spacing:.15em;color:#c9a8ff}
.sbt{font-weight:900;font-size:16px}
.chap{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.chap.lock{opacity:.45}.chap.final{border-color:#7b2cff;background:linear-gradient(135deg,#1a0a2a,#141419)}
.chn{width:34px;height:34px;flex:none;border-radius:10px;background:#2a1650;display:flex;align-items:center;justify-content:center;font-weight:900}
.snodes{display:flex;gap:5px;margin-top:6px}

.sn.ok{background:#2a1650;color:#c9a8ff;border-color:#7b2cff}.sn.cur{border-color:var(--acc);color:#fff;box-shadow:0 0 0 2px var(--acc)}.sn.boss{border-style:dashed}
#dlg{z-index:65;justify-content:flex-end;padding:0 0 30px;background:#0009;cursor:pointer}
.dbox{width:94%;max-width:440px;display:flex;gap:10px;align-items:flex-end;animation:dlgin .25s ease-out}
@keyframes dlgin{from{transform:translateY(20px);opacity:0}}
.dpor{width:84px;height:104px;flex:none;filter:drop-shadow(0 0 12px var(--sc))}.dpor svg{width:100%;height:100%}.dpor.v{border-radius:14px;overflow:hidden}
.dtxt{flex:1;background:#141419f2;border:2px solid var(--sc);border-radius:16px;padding:10px 12px;font-size:14.5px;line-height:1.35}

.dnext{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:4px;animation:tw 1s ease-in-out infinite alternate}
/* échos corrompus / libérés */
.bu.corr .bcard{filter:hue-rotate(230deg) saturate(1.5) brightness(.62) contrast(1.15);box-shadow:0 0 18px #7b2cff,0 0 34px #c43cff88!important;border-color:#7b2cff!important}
.bu.corr::before{content:"";position:absolute;left:-10%;right:-10%;top:-8%;height:80%;border-radius:50%;background:radial-gradient(circle,#c43cff66,transparent 70%);animation:aura2 1.3s ease-in-out infinite alternate;z-index:-1;pointer-events:none}
@keyframes aura2{from{transform:scale(.9);opacity:.5}to{transform:scale(1.12);opacity:1}}
.bu.purified .bcard{animation:pur2 1.2s ease-out both;opacity:1!important;filter:none}
.bu.purified{opacity:1!important;filter:none!important;transform:none!important}

.libtxt{position:absolute;left:0;right:0;top:44%;text-align:center;font-weight:900;font-size:26px;letter-spacing:.06em;color:#fff;text-shadow:0 0 18px #7fe3ff,0 0 40px #ffd96a;z-index:30;animation:ult 2s forwards;pointer-events:none}
.corrfoes .card{filter:hue-rotate(230deg) saturate(1.5) brightness(.65);box-shadow:0 0 12px #7b2cff}

/* ===== invocation manga ===== */
.sumtog{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px}
.sumtog button{border:1px solid var(--line);background:var(--bg2);color:var(--muted);border-radius:99px;padding:6px 12px;font-weight:800;font-size:12px}
.sumtog button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#shelf{z-index:40;justify-content:flex-start;padding-top:40px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2a1d14,#0b0806 75%)}

.shint .muted{display:block;font-size:12px;font-weight:600;margin-top:3px}
.shelfbox{width:100%;max-width:380px;margin-top:14px;padding:12px 10px 0;border-radius:10px;background:linear-gradient(90deg,#3a2414,#5a3a20 8%,#4a2e18 92%,#3a2414);box-shadow:inset 0 0 40px #000c,0 20px 40px #000a;transition:opacity .5s,transform .6s}
.shelfbox.gone{opacity:0;transform:translateY(60px) scale(.9);pointer-events:none}
.shrow{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:196px;padding:0 6px;background:linear-gradient(#1a0e06,#2a180c)}
.plank{height:16px;margin:0 -10px 12px;background:linear-gradient(#8a5a32,#5a3a1e);box-shadow:0 6px 10px #000a;border-radius:2px}
.spine{position:relative;border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,hsl(var(--sh),60%,28%),hsl(var(--sh),75%,48%) 30%,hsl(var(--sh),70%,40%) 70%,hsl(var(--sh),60%,24%));box-shadow:inset 0 0 0 1px #0004,2px 0 3px #0006;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;cursor:grab;transform-origin:bottom center;transition:transform .35s cubic-bezier(.3,1.4,.4,1),opacity .4s,filter .4s;touch-action:none;user-select:none}
.spine.hold{transition:none;z-index:5;filter:brightness(1.2)}
.spine .skj{font-family:"Noto Sans JP";font-weight:900;font-size:17px;color:#fff;text-shadow:0 1px 0 #0008}
.spine .stt{writing-mode:vertical-rl;font-size:9.5px;font-weight:900;letter-spacing:.08em;color:#fffe;margin-top:6px;flex:1;overflow:hidden;text-transform:uppercase}
.spine .svol{font-size:9px;font-weight:900;background:#fff;color:#111;border-radius:3px;padding:1px 3px}
.spine.pulled{transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .5s .2s;transform:translateY(-120px) scale(1.25)!important;opacity:0;z-index:6}
.spine.dim{filter:brightness(.45)}
.bookstage{position:absolute;inset:90px 0 120px;display:flex;align-items:center;justify-content:center;perspective:1100px;pointer-events:none;opacity:0;transition:opacity .4s}
.bookstage.on{opacity:1;pointer-events:auto}
.bookwrap{transform:scale(.4) rotateX(10deg) rotateY(-40deg);transition:transform .7s cubic-bezier(.2,1.2,.4,1);transform-style:preserve-3d;touch-action:none;cursor:grab}
.bookstage.on .bookwrap{transform:rotateX(-10deg) rotateY(36deg) scale(1)}
.bookstage.on .bookwrap.spread{transform:translateX(-46%) rotateX(0) rotateY(0) scale(.86)}
.book{position:relative;width:200px;height:290px;transform-style:preserve-3d}
.book::before{content:"";position:absolute;inset:-60px;border-radius:50%;background:radial-gradient(circle,var(--eg),transparent 65%);opacity:.35;transform:translateZ(-40px);animation:tw 1.4s ease-in-out infinite alternate;pointer-events:none}
.book.rC::before{opacity:.08}.book.rR::before{opacity:.18}
.bk-page,.leaf,.bk-cover{position:absolute;inset:0;transform-style:preserve-3d}
.bk-page{background:#fbf8f0;border-radius:2px 6px 6px 2px;overflow:hidden;box-shadow:inset -12px 0 18px -10px #0006}
.bk-page svg,.leaf svg{width:100%;height:100%;display:block}
.book.glow .bk-page{box-shadow:0 0 50px 10px var(--eg),inset 0 0 30px var(--eg)}
.bk-edge{position:absolute;left:0;top:0;width:34px;height:290px;transform-origin:left center;transform:rotateY(90deg);border-radius:2px}
.bk-top{position:absolute;left:0;top:0;width:200px;height:34px;transform-origin:center top;transform:rotateX(-90deg)}
.book.rX .bk-edge,.book.rX .bk-top{background-size:100% 100%,300% 100%!important;animation:cosm 2.5s linear infinite}
@keyframes cosm{to{background-position:0 0,300% 0}}
.book.rD .bk-edge,.book.rD .bk-top{animation:dshine 1.2s ease-in-out infinite alternate}
@keyframes dshine{to{filter:brightness(1.25)}}
.leaf{transform-origin:right center;transition:transform .32s cubic-bezier(.4,.1,.3,1)}
.leaf .lf,.leaf .lb,.bk-cover .cf,.bk-cover .cb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2px 6px 6px 2px;overflow:hidden}
.leaf .lb,.bk-cover .cb{transform:rotateY(180deg)}
.leaf .lf{box-shadow:inset -10px 0 14px -10px #0006}
.leaf.turn{transform:rotateY(178deg)}
.bk-cover{transform-origin:right center;z-index:30;transform:translateZ(1px)}
.bk-cover .cf{display:flex;flex-direction:column;align-items:center;padding:16px 10px;color:#fff;box-shadow:inset 0 0 0 2px #0003,inset -10px 0 12px -6px #0008}
.bk-cover .cb{background:#f1ecdf;box-shadow:inset 10px 0 18px -10px #0006}.bk-cover .cb svg{width:100%;height:100%;display:block}
.ctone{position:absolute;inset:0;background:radial-gradient(#0003 1px,transparent 1.6px) 0 0/7px 7px;mix-blend-mode:multiply}
.ckj{font-family:"Noto Sans JP";font-size:96px;font-weight:900;line-height:1.1;margin-top:20px;text-shadow:0 4px 0 #0005;z-index:1}
.ctt{font-weight:900;font-size:20px;letter-spacing:.04em;text-transform:uppercase;z-index:1;text-align:center}
.cvol{margin-top:6px;font-weight:900;font-size:11px;background:#fff;color:#111;padding:2px 8px;border-radius:4px;z-index:1}
.cbar{margin-top:auto;font-size:9.5px;font-weight:800;letter-spacing:.15em;opacity:.9;z-index:1}
.shleg{position:absolute;bottom:64px;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:10.5px;font-weight:700;color:var(--muted);opacity:0;transition:opacity .5s;padding:0 14px}
.shleg.on{opacity:1}.shleg span{display:flex;align-items:center;gap:4px}.shleg i{width:14px;height:10px;border-radius:2px;display:inline-block}
#shCancel{position:absolute;bottom:18px}
.bookstage.on .bookwrap.riffle{transform:rotateX(-6deg) rotateY(14deg) scale(1)}
.bookstage.on .bookwrap.zoom{transition:transform .65s cubic-bezier(.6,0,.9,.4);transform:rotateX(0) rotateY(0) scale(5)}
.leaf .lf,.leaf .lb{background:repeating-linear-gradient(0deg,#0000000a 0 1px,transparent 1px 9px),#fbf8f0}
.leaf{transition:transform .14s linear}
.shflash.hold{animation:shhold .65s ease-in forwards}@keyframes shhold{0%{opacity:0;transform:scale(.3);border-radius:50%}100%{opacity:1;transform:scale(1.6);border-radius:0}}

.shflash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:50}.shflash.on{animation:shfl .7s ease-out}@keyframes shfl{0%{opacity:.95}100%{opacity:0}}
/* ===== cinématique lore ===== */
#lore{position:absolute;inset:0;z-index:70;display:none;background:#000;overflow:hidden;cursor:pointer}
#lore .lstage{position:absolute;inset:0;transition:background .8s}
#lore .lshot{position:absolute;inset:0;animation:lfade .7s ease-out}
@keyframes lfade{from{opacity:0;transform:scale(1.06)}}
#lore .lbars{position:absolute;left:0;right:0;height:13%;background:#000;z-index:5}#lore .lbars.t{top:0}#lore .lbars.b{bottom:0;display:flex;align-items:center;justify-content:center;padding:0 22px}
#lore .lcap{color:#fff;text-align:center;font-size:14.5px;line-height:1.4;font-weight:600;opacity:0}#lore .lcap.in{animation:capin .8s .3s forwards}
@keyframes capin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
#lore .lskip{position:absolute;top:calc(13% + 10px);right:12px;z-index:6;background:#0008;color:#fff;border:1px solid #fff4;border-radius:99px;padding:6px 12px;font-weight:800;font-size:12px}
#lore .ltitle{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;letter-spacing:.3em;color:#fff;background:#000;pointer-events:none;transition:opacity .8s .6s}
#lore .ltitle.go{opacity:0}
#lore .lcard{position:absolute;left:50%;top:44%;width:150px;height:216px;margin:-108px 0 0 -75px}
#lore .lci{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;background:#333;animation:lpur 3.6s ease-in-out forwards;border:3px solid #fff}
@keyframes lpur{0%{filter:hue-rotate(230deg) saturate(1.6) brightness(.5);box-shadow:0 0 40px #c43cff}50%{filter:hue-rotate(230deg) saturate(1.6) brightness(.6);box-shadow:0 0 60px #c43cff}70%{filter:brightness(3);box-shadow:0 0 80px #fff}100%{filter:none;box-shadow:0 0 50px #ffd96a}}
#lore .smoke{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;background:radial-gradient(circle,#c43cffaa,transparent 70%);animation:smk 2.4s ease-in forwards;transform:rotate(var(--a)) translateX(50px)}
@keyframes smk{to{transform:rotate(calc(var(--a) + 160deg)) translateX(190px) scale(2);opacity:0}}
#lore .rays{position:absolute;left:50%;top:44%;width:600px;height:600px;margin:-300px;background:repeating-conic-gradient(#ffd96a33 0 6deg,transparent 6deg 18deg);border-radius:50%;opacity:0;animation:rays 3.6s 2.2s forwards,spin 20s linear infinite;-webkit-mask:radial-gradient(circle,#000,transparent 65%);mask:radial-gradient(circle,#000,transparent 65%)}
@keyframes rays{to{opacity:1}}@keyframes spin{to{rotate:360deg}}
#lore .stars{position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 10% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 45%,#fff,transparent);animation:tw 2s infinite alternate}
#lore .lshard{position:absolute;left:20%;top:72%;width:26px;height:44px;background:var(--c);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);filter:drop-shadow(0 0 14px var(--c));animation:shfly 3s ease-in-out forwards}
@keyframes shfly{0%{transform:scale(.4);opacity:0}20%{opacity:1}100%{left:58%;top:34%;transform:scale(1) rotate(360deg)}}
#lore .lhoshi{position:absolute;width:110px;height:110px;left:52%;top:26%;animation:fl 2s ease-in-out infinite alternate}#lore .lhoshi svg,#lore .lhero svg,#lore .lv svg{width:100%;height:100%}
@keyframes fl{to{transform:translateY(-10px)}}
#lore .lhoshi.catch{animation:fl 2s ease-in-out infinite alternate,hglow 3s 2.6s forwards}
@keyframes hglow{to{filter:drop-shadow(0 0 30px #ffd34d) brightness(1.3)}}
#lore .lhero{position:absolute;width:120px;height:160px;left:8%;bottom:14%}#lore .lhero.small{width:90px;height:120px}
#lore .lc{position:absolute;left:50%;top:46%;width:300px;height:300px;margin:-150px;animation:spinin 1.2s ease-out}
@keyframes spinin{from{transform:scale(.5) rotate(-60deg);opacity:0}}
#lore .lcrys{width:100%;height:100%}#lore .slotnew{animation:snew 1.4s .8s both;transform-origin:150px 150px}
@keyframes snew{0%{opacity:0;transform:scale(2.5)}60%{opacity:1;transform:scale(.9)}100%{transform:scale(1)}}
#lore .lcount{position:absolute;left:0;right:0;top:calc(46% + 150px);text-align:center;font-weight:900;letter-spacing:.3em;color:#c9a8ff}
#lore .lv{position:absolute;left:50%;top:44%;width:220px;height:300px;margin:-150px 0 0 -110px;animation:vin 3.5s ease-out}
#lore .lv.big{width:260px;height:354px;margin:-177px 0 0 -130px}
@keyframes vin{from{transform:scale(1.25);filter:brightness(.3)}}
#lore .lv .crk{position:absolute;inset:0}
@keyframes crk{to{stroke-dashoffset:0}}
#lore .bolt{position:absolute;inset:0;background:#c43cff;opacity:0;animation:bolt 3.5s .4s}
@keyframes bolt{0%,8%,14%,100%{opacity:0}4%,11%{opacity:.35}}
#lore .portal{position:absolute;left:50%;top:42%;width:240px;height:240px;margin:-120px}
#lore .portal i{position:absolute;inset:0;border-radius:50%;border:6px solid var(--c);border-left-color:transparent;border-right-color:transparent;animation:spin 1.6s linear infinite,popen 1.4s ease-out both;box-shadow:0 0 30px var(--c),inset 0 0 30px var(--c)}
#lore .portal i:nth-child(2){inset:30px;animation-direction:reverse,normal;animation-duration:1.1s,1.4s}#lore .portal i:nth-child(3){inset:64px;background:radial-gradient(circle,#fff,var(--c) 60%,transparent);border:0}
@keyframes popen{from{transform:scale(0)}}
#lore .lnext{position:absolute;left:0;right:0;top:calc(42% + 140px);text-align:center;color:#fff;font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;animation:capin 1s 1s both}
#lore .lnext b{display:block;font-size:24px;letter-spacing:.04em;text-transform:none;margin-top:4px}
#lore .shatter{animation:shat 3.5s forwards}
@keyframes shat{0%{filter:none}40%{filter:brightness(2)}100%{opacity:0;transform:scale(1.4)}}
#lore .shard{position:absolute;left:50%;top:30%;width:18px;height:26px;background:#efe9ff;clip-path:polygon(0 0,100% 30%,40% 100%);animation:shd 2.4s 1.2s ease-out both}
@keyframes shd{from{transform:rotate(var(--a)) translateX(0);opacity:0}10%{opacity:1}to{transform:rotate(var(--a)) translateX(var(--d)) rotate(400deg);opacity:0}}
#lore .lworlds{position:absolute;left:50%;top:44%;width:300px;height:300px;margin:-150px;animation:spin 30s linear infinite}
#lore .lnk{stroke-dasharray:120;stroke-dashoffset:120;animation:lnk 1.2s forwards}@keyframes lnk{to{stroke-dashoffset:0}}
#lore .lsun{position:absolute;left:50%;top:52%;width:220px;height:220px;margin:-110px;border-radius:50%;background:radial-gradient(circle,#fff6c9,#ffd34d 50%,transparent 70%);animation:sunr 3.5s ease-out both}
@keyframes sunr{from{transform:translateY(80px)}}
#lore .lfin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:58px;font-weight:900;letter-spacing:.2em;color:#fff;animation:capin 1.5s both}
#lore .lfin small{font-size:13px;letter-spacing:.12em;color:#c9a8ff;margin-top:8px}
#lore .lecho{position:absolute;bottom:14%;width:34px;height:50px;border-radius:8px;background:var(--c);box-shadow:0 0 18px var(--c);animation:fl 1.6s ease-in-out infinite alternate,capin 1s both}
.lrep{margin-top:4px;border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:2px 6px;font-size:13px}

/* netteté + fluidité : pas d'animations lourdes dans les grilles (sinon le WebView Android baisse la résolution) */
.grid>div{min-width:0}
.grid .card::after{display:none!important}
.grid .card.X{animation:none!important;background-size:100% 100%}
.grid .card .mframe *{animation:none!important}
.card img{image-rendering:auto}
.bookwrap,.leaf,.bk-cover{will-change:transform}

.dtabs{display:flex;gap:6px;margin-bottom:8px}.dtabs button{flex:1;border:1px solid var(--line);background:var(--bg2);color:var(--muted);border-radius:12px;padding:9px 4px;font-weight:900;font-size:12.5px}
.dtabs button.on{border-color:var(--dc);color:#fff;background:color-mix(in srgb,var(--dc) 28%,var(--bg2));box-shadow:0 0 14px -4px var(--dc)}
.dinfo{border:1px solid color-mix(in srgb,var(--dc) 50%,transparent);background:color-mix(in srgb,var(--dc) 10%,var(--bg2));border-radius:12px;padding:9px 11px;font-size:12.5px;line-height:1.35;margin-bottom:10px}

/* ===== passe / succès / arène / raid de guilde / synergies ===== */
.passban,.arban{display:flex;gap:12px;align-items:center;margin:10px 0 12px;padding:12px;border-radius:18px;cursor:pointer;color:#fff}
.passban{background:linear-gradient(135deg,var(--pc2),#141419 80%);border:1px solid color-mix(in srgb,var(--pc) 60%,transparent);box-shadow:0 8px 24px -12px var(--pc)}
.pbkj{width:52px;height:52px;flex:none;border-radius:14px;background:linear-gradient(135deg,var(--pc),var(--pc2));display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP";font-weight:900;font-size:28px;text-shadow:0 2px 0 #0004}
.passhead{position:relative;overflow:hidden;border-radius:18px;padding:14px;background:linear-gradient(135deg,var(--pc2),#141419);border:1px solid color-mix(in srgb,var(--pc) 60%,transparent);margin-bottom:10px}
.phkj{position:absolute;right:-6px;top:-18px;font-family:"Noto Sans JP";font-weight:900;font-size:120px;color:var(--pc);opacity:.18}
.ptiers{display:flex;flex-direction:column;gap:6px}
.ptier{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;opacity:.6}
.ptier.ok{opacity:1;border-color:var(--acc);box-shadow:0 0 12px -6px var(--acc)}.ptier.got{opacity:.85}.ptier.big{background:linear-gradient(90deg,#3a2a00,var(--bg2));border-color:#ffb54788}
.ptn{width:30px;height:30px;flex:none;border-radius:50%;background:#0f0d1a;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}

<script>
"use strict";
// ================= DONNÉES =================
const RAR=[
 {id:"C",name:"Commun",min:1101,max:3100,odds:62,shard:1,base:100},
 {id:"R",name:"Rare",min:401,max:1100,odds:27,shard:3,base:140},
 {id:"E",name:"Épique",min:201,max:400,odds:8.5,shard:10,base:195},
 {id:"L",name:"Légendaire",min:61,max:200,odds:1.2,shard:40,base:265},
 {id:"M",name:"Mythique",min:21,max:60,odds:.4,shard:150,base:350},
 {id:"D",name:"Divin",min:7,max:20,odds:.08,shard:400,base:450},
 {id:"X",name:"Cosmos",min:1,max:6,odds:.02,shard:1000,base:560}];
const RI={};RAR.forEach((r,i)=>RI[r.id]=i);
const CLS=[
 {id:"war",name:"Guerrier",ic:"⚔️",hp:1,atk:1,spd:100,ult:"Frappe dévastatrice",ud:"Inflige 260 % de dégâts à un ennemi"},
 {id:"mag",name:"Mage",ic:"🔮",hp:.8,atk:1.3,spd:95,ult:"Tempête arcanique",ud:"Inflige 110 % de dégâts à tous les ennemis"},
 {id:"ass",name:"Assassin",ic:"🗡️",hp:.75,atk:1.25,spd:122,ult:"Exécution",ud:"Inflige 320 % de dégâts à l'ennemi le plus faible. 25 % de critiques"},
 {id:"tnk",name:"Tank",ic:"🛡️",hp:1.65,atk:.7,spd:85,ult:"Rempart",ud:"Bouclier de 22 % de ses PV max à toute l'équipe. Attire les coups"},
 {id:"hea",name:"Soigneur",ic:"💚",hp:1,atk:.65,spd:106,ult:"Souffle de vie",ud:"Soigne toute l'équipe de 28 % de ses PV max"}];
const ELS=[{id:"fire",name:"Feu",ic:"🔥",c:"#ff6a3d"},{id:"water",name:"Eau",ic:"💧",c:"#3b9cff"},{id:"wind",name:"Vent",ic:"🌪️",c:"#3bff9c"},{id:"light",name:"Lumière",ic:"☀️",c:"#ffd34d"},{id:"dark",name:"Ombre",ic:"🌑",c:"#b45cff"},{id:"thunder",name:"Foudre",ic:"⚡",c:"#7fd4ff"}];
const ADV={fire:"wind",wind:"thunder",thunder:"water",water:"fire",light:"dark",dark:"light"};
const WORLDS=[
 {kj:"桜",name:"Village des Cerisiers",ic:"🌸",bg:"linear-gradient(135deg,#ff7aa8,#7b2c6e)",el:["wind","light"],mobs:[["Tanuki farceur","🦝"],["Kitsune rusée","🦊"],["Oni mineur","👺"]],boss:["Oni Rouge","👹"]},
 {kj:"海",name:"Archipel des Tempêtes",ic:"🌊",bg:"linear-gradient(135deg,#1fb7ff,#163a7b)",el:["water","wind"],mobs:[["Kappa","🐸"],["Requin-démon","🦈"],["Esprit des vagues","🫧"]],boss:["Kraken Abyssal","🐙"]},
 {kj:"炎",name:"Volcan Écarlate",ic:"🌋",bg:"linear-gradient(135deg,#ff8a3d,#6e1a1a)",el:["fire","dark"],mobs:[["Salamandre","🦎"],["Golem de lave","🗿"],["Phénix noir","🐦‍🔥"]],boss:["Dragon des Cendres","🐉"]},
 {kj:"影",name:"Cité des Ombres",ic:"🌙",bg:"linear-gradient(135deg,#6a4cff,#1a1240)",el:["dark","water"],mobs:[["Spectre","👻"],["Ninja maudit","🥷"],["Araignée-démon","🕷️"]],boss:["Shinigami","💀"]},
 {kj:"天",name:"Ciel Céleste",ic:"☁️",bg:"linear-gradient(135deg,#ffe07a,#6a9bff)",el:["light","fire"],mobs:[["Tengu","🦅"],["Gardien céleste","🗽"],["Ange déchu","😇"]],boss:["Kami du Soleil","☀️"]}];
const EVENTS=[
 {n:"Dimanche Mythique",d:"Chances de Mythique ×2",k:"myth"},{n:"Lundi XP",d:"XP des combats ×2",k:"xp"},
 {n:"Mardi Éclats",d:"Éclats gagnés en combat ×2",k:"shard"},{n:"Mercredi Boosters",d:"Un booster gratuit toutes les 5 minutes",k:"refill"},
 {n:"Jeudi Onigiri",d:"Onigiri gagnés ×2",k:"oni"},{n:"Vendredi Légendaire",d:"Chances de Légendaire ×2",k:"leg"},
 {n:"Samedi Raid",d:"5 essais de Raid au lieu de 3",k:"raid"}];
const MAXB=5,PACKCOST=60,PITY=120,ONICOST=25,ONIXP=400;
const API="https://graphql.anilist.co";
const Q=`query($page:Int){Page(page:$page,perPage:50){characters(sort:FAVOURITES_DESC){id name{full} image{large} favourites media(perPage:3,sort:POPULARITY_DESC){nodes{isAdult title{romaji english}}}}}}`;
const today=()=>new Date().toDateString();
const EV=()=>EVENTS[new Date().getDay()];
const refillMs=()=>EV().k==="refill"?5*60000:10*60000;

// ================= ÉTAT =================
let S={boosters:MAXB,nextAt:0,shards:0,coll:{},opened:0,pity:0,team:[],oni:3,frag:0,prog:{},tower:0,raid:{day:"",tries:0,best:0},daily:{day:"",c:{},claimed:{},login:false},wins:0};
function load(){try{const r=localStorage.getItem("otaku_v1");if(r)S=Object.assign(S,JSON.parse(r))}catch(_){}
 Object.values(S.coll).forEach(c=>{c.lvl=c.lvl||1;c.xp=c.xp||0;c.star=c.star||1;const r=RAR.find(r=>c.rank>=r.min&&c.rank<=r.max);if(r&&RI[r.id]>RI[c.rarity])c.rarity=r.id});S.team=(S.team||[]).filter(id=>S.coll[id])}
function save(){try{localStorage.setItem("otaku_v1",JSON.stringify(S))}catch(_){}}
let pageCache={};try{pageCache=JSON.parse(localStorage.getItem("otaku_pages")||"{}")}catch(_){}
function savePages(){try{localStorage.setItem("otaku_pages",JSON.stringify(pageCache))}catch(_){}}
function dailyReset(){const d=today();if(S.daily.day!==d){S.daily={day:d,c:{},claimed:{},login:false}}if(S.raid.day!==d){S.raid.day=d;S.raid.tries=0}}
function bump(k,n){dailyReset();S.daily.c[k]=(S.daily.c[k]||0)+(n||1);if(typeof PXP!=="undefined"&&PXP[k])passXp(PXP[k]*(n||1))}

// ================= ANILIST =================
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let DEMO=false;const inflight={};
function demoPage(p){return[...Array(50)].map((_,i)=>{const rk=(p-1)*50+i+1,h=(rk*47)%360;
 const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='230' height='345'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='hsl(${h},75%,62%)'/><stop offset='1' stop-color='hsl(${(h+70)%360},60%,22%)'/></linearGradient></defs><rect width='230' height='345' fill='url(#g)'/><circle cx='115' cy='118' r='52' fill='hsla(0,0%,100%,.85)'/><path d='M40 300 Q115 170 190 300Z' fill='hsla(0,0%,100%,.85)'/><text x='115' y='132' font-size='34' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='hsl(${h},50%,35%)'>?</text></svg>`;
 return{id:-rk,name:"Personnage n°"+rk,img:"data:image/svg+xml,"+encodeURIComponent(svg),fav:Math.round(250000/Math.sqrt(rk)),adult:false,series:"Aperçu · série "+(rk%40+1)}})}
async function fetchPage(p){if(DEMO)return demoPage(p);
 try{return await realFetch(p)}catch(e){if(e instanceof TypeError){DEMO=true;$("demoBanner").style.display="block";return demoPage(p)}throw e}}
async function realFetch(p){if(pageCache[p])return pageCache[p];if(inflight[p])return inflight[p];
 inflight[p]=(async()=>{for(let a=0;a<3;a++){
  const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query:Q,variables:{page:p}})});
  if(res.status===429){await sleep(2500*(a+1));continue}if(!res.ok)throw new Error("HTTP "+res.status);
  const j=await res.json();const list=j.data.Page.characters.map(c=>{const m=(c.media&&c.media.nodes)||[];return{id:c.id,name:c.name.full,img:c.image.large,fav:c.favourites,adult:m.some(x=>x.isAdult),series:m[0]?(m[0].title.english||m[0].title.romaji):"???"}});
  pageCache[p]=list;savePages();return list}throw new Error("Trop de requêtes, réessaie dans un instant")})();
 try{return await inflight[p]}finally{delete inflight[p]}}
async function charAt(rank,r){for(let k=0;k<6;k++){const rk=Math.min(r.max,rank+k);const list=await fetchPage(Math.ceil(rk/50));const c=list[(rk-1)%50];if(c&&!c.adult&&c.img)return Object.assign({rarity:r.id,rank:rk},c)}throw new Error("Personnage introuvable")}

// ================= STATS DES CARTES =================
function hash(n){n=Math.abs(n)>>>0;n=Math.imul(n^(n>>>16),2246822507);n=Math.imul(n^(n>>>13),3266489909);return(n^(n>>>16))>>>0}
function clsOf(c){return CLS[hash(c.id)%5]}
function elOf(c){return ELS[(hash(c.id)>>>8)%6]}

function hstr(s){let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return h}
function genLandscape(series){const r=rng(hstr(series)),h=Math.floor(r()*360),h2=(h+40+Math.floor(r()*80))%360;const W=480,H=300;
 const mount=(base,amp,col)=>{let p=`M0 ${H} L0 ${base}`;for(let x=0;x<=W;x+=24)p+=` L${x} ${(base-amp*r()-Math.sin(x/60)*amp*.4).toFixed(0)}`;return`<path d="${p} L${W} ${H}Z" fill="${col}"/>`};
 let stars="";for(let i=0;i<30;i++)stars+=`<circle cx="${(r()*W).toFixed(0)}" cy="${(r()*120).toFixed(0)}" r="${(r()*1.4+.3).toFixed(1)}" fill="#fff" opacity="${(r()*.7+.2).toFixed(2)}"/>`;
 const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${W} ${H}' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='s' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='hsl(${h},55%,18%)'/><stop offset='.6' stop-color='hsl(${h2},65%,45%)'/><stop offset='1' stop-color='hsl(${h2+20},80%,70%)'/></linearGradient></defs><rect width='${W}' height='${H}' fill='url(#s)'/>${stars}<circle cx='${(100+r()*280).toFixed(0)}' cy='150' r='46' fill='hsl(${h2+30},90%,82%)' opacity='.9'/>${mount(190,60,`hsl(${h},35%,28%)`)}${mount(225,45,`hsl(${h},40%,18%)`)}${mount(260,30,`hsl(${h},45%,10%)`)}</svg>`;
 return"data:image/svg+xml,"+encodeURIComponent(svg)}
const QB=`query($id:Int){Character(id:$id){media(perPage:6,sort:POPULARITY_DESC){nodes{isAdult bannerImage coverImage{extraLarge} trailer{id site}}}}}`;
async function loadBg(c){if(c.bg&&c.trailer!==undefined)return c.bg;if(c.id<0||DEMO)return null;
 try{const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query:QB,variables:{id:c.id}})});if(!res.ok)return c.bg||null;
  const j=await res.json();const n=(j.data.Character.media.nodes||[]).filter(m=>!m.isAdult);const b=(n.find(m=>m.bannerImage)||{}).bannerImage||(n[0]&&n[0].coverImage&&n[0].coverImage.extraLarge);
  const tr=n.find(m=>m.trailer&&m.trailer.site==="youtube"&&m.trailer.id);c.trailer=tr?tr.trailer.id:null;if(b)c.bg=b;save();return c.bg||null}catch(_){return c.bg||null}}
function setDetailBg(c){const el=$("detail").querySelector(".dbg");if(!el)return;const put=u=>{const im=new Image();im.onload=()=>{if(!el.isConnected)return;el.style.backgroundImage=`url("${u}")`;el.style.opacity=1};im.onerror=()=>{if(u.startsWith("http"))put(genLandscape(c.series))};im.src=u};
 if(c.bg&&c.trailer!==undefined){put(c.bg);startScene(c);return}loadBg(c).then(u=>{put(u||genLandscape(c.series));startScene(c)})}
function addXp(c,x){c.xp+=x;while(c.lvl<maxLvl(c)&&c.xp>=xpNeed(c.lvl)){c.xp-=xpNeed(c.lvl);c.lvl++}if(c.lvl>=maxLvl(c))c.xp=0;if(typeof checkMaster==="function")checkMaster(c)}
