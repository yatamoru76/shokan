<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shōkan · 召喚</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d1a;--bg2:#1a1630;--card:#221c3d;--ink:#f4f1ff;--muted:#a49cc4;--line:#3a3260;--C:#9aa4b1;--R:#3b9cff;--E:#b45cff;--L:#ffb020;--M:#ff3d6e;--acc:#ff3d6e;--ok:#3bff9c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:inherit}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,sans-serif;overflow:hidden}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:radial-gradient(circle at 50% -10%,#3a1f6e 0,transparent 60%),var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;gap:6px}
.logo{font-weight:900;font-size:18px;letter-spacing:.02em;white-space:nowrap}
.logo span{color:var(--acc)}
.res{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:6px 12px 14px}
nav{display:flex;border-top:1px solid #2c2550;background:#141126}
nav button{flex:1;background:none;border:0;color:var(--muted);font-weight:700;font-size:10.5px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button .i{font-size:19px}
nav button.on{color:var(--ink)}
nav .dot{position:absolute;top:6px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--acc);display:none}
h2{margin:8px 0 6px;font-size:18px}h3{margin:14px 0 6px;font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:900;font-size:15px;color:#fff;background:linear-gradient(135deg,#ff3d6e,#b45cff);box-shadow:0 6px 20px #ff3d6e44}
.btn:disabled{background:#3a3260;box-shadow:none;color:#8d84ad}
.btn.ghost{background:var(--bg2);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:8px 10px;font-size:13px;border-radius:10px}
.btn.gold{background:linear-gradient(135deg,#ffb020,#ff6a3d)}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.muted{color:var(--muted);font-size:13px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
/* Pack */
.packWrap{display:flex;justify-content:center;padding:10px 0 6px;perspective:800px}
.pack{width:170px;height:240px;border-radius:16px;position:relative;cursor:pointer;background:linear-gradient(160deg,#ff3d6e,#7b2cff 55%,#1fb7ff);box-shadow:0 0 40px #b45cff66,inset 0 0 0 3px #ffffff33;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:float 3s ease-in-out infinite}
.pack::before{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,#ffffff55 50%,transparent 60%);animation:shine 3s linear infinite}
.pack .t1{font-weight:900;font-size:26px;line-height:.95;text-align:center;text-shadow:0 3px 0 #0005;z-index:1}
.pack .t2{font-size:11px;font-weight:700;letter-spacing:.2em;margin-top:8px;opacity:.85;z-index:1}
.pack .kanji{position:absolute;font-size:140px;opacity:.12;font-weight:900}
.pack.shake{animation:shake .5s ease-in-out infinite}.pack.burst{animation:burst .45s ease-in forwards}
@keyframes float{50%{transform:translateY(-8px) rotateY(8deg)}}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) scale(1.03)}75%{transform:rotate(4deg) scale(1.03)}}
@keyframes burst{to{transform:scale(1.6);opacity:0;filter:brightness(3)}}
.event{background:linear-gradient(135deg,#3a1f6e,#1f2b6e);border:1px solid #6a4cff;border-radius:14px;padding:9px 12px;font-size:13px;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.stat{background:var(--bg2);border-radius:12px;padding:7px 3px;text-align:center;font-size:10.5px;color:var(--muted)}
.stat b{display:block;font-size:16px;color:var(--ink)}
.odds div{display:flex;justify-content:space-between;padding:2px 0;font-size:13px}
/* Cards */
.card{position:relative;aspect-ratio:2.5/3.6;border-radius:12px;overflow:hidden;background:var(--card);border:3px solid var(--rc,#555);box-shadow:0 4px 14px #0007}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .ov{position:absolute;left:0;right:0;bottom:0;padding:16px 5px 4px;background:linear-gradient(transparent,#000d 40%)}
.card .nm{font-weight:700;font-size:11.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sr{font-size:9px;color:#d5cff0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .stars{font-size:9px;color:#ffd34d;letter-spacing:-1px}
.card .rb{position:absolute;top:4px;left:4px;background:var(--rc);color:#fff;font-size:8.5px;font-weight:900;padding:2px 5px;border-radius:6px;text-transform:uppercase}
.card .ce{position:absolute;top:4px;right:4px;background:#000b;font-size:10px;padding:1px 4px;border-radius:6px}
.card .cnt{position:absolute;top:22px;right:4px;background:#000b;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:6px}
.card .lv{position:absolute;top:22px;left:4px;background:#000b;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:6px}
.card .tm{position:absolute;inset:0;border:3px solid var(--ok);border-radius:9px;pointer-events:none}
.card.E::after,.card.L::after,.card.M::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff40 45%,#ffffff10 55%,transparent 70%);background-size:250% 100%;animation:holo 2.5s linear infinite;mix-blend-mode:screen;pointer-events:none}
.card.M{border-color:transparent;background:conic-gradient(#ff3d6e,#ffb020,#3bff9c,#3b9cff,#b45cff,#ff3d6e) border-box}
.card.awk{box-shadow:0 0 16px #ffd34d,0 0 4px #fff}
.card.awk::before{content:"覚醒";position:absolute;bottom:34px;right:4px;font-size:10px;font-weight:900;color:#ffd34d;text-shadow:0 0 6px #ff6a00;z-index:2}
@keyframes holo{from{background-position:150% 0}to{background-position:-100% 0}}
.C{--rc:var(--C)}.R{--rc:var(--R)}.E{--rc:var(--E)}.L{--rc:var(--L)}.M{--rc:var(--M)}
/* Reveal */
.ovl{position:absolute;inset:0;z-index:20;background:#0b0915f2;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
#revealGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%;max-width:420px}
.flip{width:30%;perspective:900px;cursor:pointer;animation:deal .4s backwards;position:relative}
@keyframes deal{from{transform:translateY(80px) scale(.6);opacity:0}}
.flip .inner{position:relative;width:100%;aspect-ratio:2.5/3.6;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.open .inner{transform:rotateY(180deg)}
.flip .back,.flip .front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.flip .back{border-radius:12px;background:repeating-linear-gradient(45deg,#2a1f55 0 10px,#22194a 10px 20px);border:3px solid #5a4a9a;display:flex;align-items:center;justify-content:center;font-size:30px}
.flip.glowE .back{box-shadow:0 0 18px var(--E)}.flip.glowL .back{box-shadow:0 0 24px var(--L);animation:pulse 1s infinite}.flip.glowM .back{box-shadow:0 0 30px var(--M);animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.new{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06281a;font-size:10px;font-weight:900;padding:2px 7px;border-radius:6px;z-index:3;display:none}
.flip.open .new{display:block}
.burstfx{position:absolute;pointer-events:none;width:12px;height:12px;border-radius:50%;animation:spark .8s ease-out forwards;z-index:60}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
/* Collection */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:99px;padding:6px 11px;font-weight:700;font-size:12px}
.filters button.on{background:var(--ink);color:var(--bg)}
input[type=search]{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:14px;margin-bottom:8px;user-select:text}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#detail{z-index:25;justify-content:flex-start;overflow-y:auto;padding-top:20px}
#detail .card{width:190px;flex:none}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:360px;margin-top:10px}
.statgrid div{background:var(--bg2);border-radius:10px;padding:6px;text-align:center;font-size:10.5px;color:var(--muted)}
.statgrid b{display:block;color:var(--ink);font-size:14px}
.xpbar{height:8px;background:#2c2550;border-radius:99px;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#3bff9c,#3b9cff)}
/* Team */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:2.5/3.6;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;position:relative}
.slot .card{position:absolute;inset:-2px}
.slot .ce,.slot .sr,.slot .rb{display:none}.slot .nm{font-size:9px}.slot .lv{top:4px}
.power{font-size:22px;font-weight:900;text-align:center;margin:8px 0 2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
/* Aventure */
.world{border-radius:16px;padding:12px;margin-bottom:10px;position:relative;overflow:hidden;border:1px solid #ffffff22}
.world .wt{font-weight:900;font-size:16px}
.world.lock{filter:grayscale(1);opacity:.5}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.stg{background:#0008;border:1px solid #ffffff33;border-radius:10px;padding:6px 2px;text-align:center;font-weight:900;font-size:13px;cursor:pointer}
.stg small{display:block;font-size:9px;color:#ffd34d;font-weight:700;min-height:11px}
.stg.lock{opacity:.35;cursor:default}.stg.boss{border-color:#ffd34d}
.stg.cur{box-shadow:0 0 0 2px var(--ok)}
.quest{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px;margin-top:8px}
.quest .q{flex:1;font-size:13px}
/* Battle */
#battle{z-index:30;padding:10px;justify-content:space-between;background:radial-gradient(circle at 50% 40%,#2a1d55,#0b0915)}
.bside{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%}
.unit{width:62px;text-align:center;position:relative;transition:transform .15s,opacity .4s}
.unit .av{width:58px;height:58px;border-radius:50%;margin:0 auto;border:3px solid var(--uc,#888);overflow:hidden;background:#221c3d;display:flex;align-items:center;justify-content:center;font-size:34px}
.unit.boss .av{width:76px;height:76px;font-size:48px}
.unit.boss{width:80px}
.unit .av img{width:100%;height:100%;object-fit:cover;object-position:top}
.unit .hp{height:6px;background:#2c2550;border-radius:99px;overflow:hidden;margin-top:3px}
.unit .hp i{display:block;height:100%;background:var(--ok);transition:width .25s}
.unit .en{height:4px;background:#2c2550;border-radius:99px;overflow:hidden;margin-top:2px}
.unit .en i{display:block;height:100%;background:#ffd34d;transition:width .25s}
.unit .un{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.unit .sh{position:absolute;top:0;left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;box-shadow:0 0 0 3px #6ad8ff,0 0 12px #6ad8ff;display:none}
.unit.dead{opacity:.25;filter:grayscale(1)}
.unit.act{transform:scale(1.15)}
.unit.hit{animation:hit .25s}
@keyframes hit{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.dmg{position:absolute;left:50%;top:10px;font-weight:900;font-size:16px;pointer-events:none;animation:dmg .9s ease-out forwards;text-shadow:0 2px 0 #000;z-index:5;white-space:nowrap}
@keyframes dmg{from{transform:translate(-50%,0) scale(1.3)}to{transform:translate(-50%,-40px);opacity:0}}
#blog{font-size:12.5px;color:#d9d2f5;min-height:36px;text-align:center;padding:4px}
#bhead{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:13px;font-weight:700}
.vs{font-weight:900;font-size:22px;color:var(--acc);text-align:center;margin:4px 0}
#bctrl{display:flex;gap:6px;width:100%}
#bctrl button{flex:1}
.ult{position:absolute;left:0;right:0;top:45%;text-align:center;font-weight:900;font-size:24px;color:#ffd34d;text-shadow:0 0 14px #ff6a00;pointer-events:none;animation:ult 1s forwards;z-index:10}
@keyframes ult{from{transform:scale(2);opacity:0}20%{transform:scale(1);opacity:1}to{opacity:0}}
#toast{position:absolute;top:10px;left:50%;transform:translate(-50%,-150%);background:#fff;color:#111;padding:9px 14px;border-radius:12px;font-weight:700;font-size:13px;z-index:70;transition:transform .3s;max-width:92%;text-align:center}
#toast.show{transform:translate(-50%,0)}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.5}
.foot a{color:var(--muted)}
.err{background:#3a1222;border:1px solid #ff3d6e;border-radius:12px;padding:10px;font-size:13px;margin-top:10px;display:none}
#demoBanner{display:none;margin:0 12px 4px;background:#2a2150;border:1px solid #b45cff;border-radius:12px;padding:7px 10px;font-size:11.5px;color:#d9d2f5}
#modal{z-index:50}
#modal .mbox{background:#1d1838;border:1px solid var(--line);border-radius:18px;padding:18px;max-width:340px;width:100%;text-align:center}

/* ===== THÈME MODERNE ===== */
:root{--bg:#09090c;--bg2:#141419;--card:#18181f;--ink:#f4f4f6;--muted:#8a8a99;--line:#26262f;--C:#8e9aaf;--R:#4da3ff;--E:#a970ff;--L:#ffb547;--M:#ff4d6d;--acc:#ff4d2e;--ok:#34d399}
html,body{font-family:"Inter","Noto Sans JP",system-ui,sans-serif;letter-spacing:-.005em}
.jpf{font-family:"Noto Sans JP",sans-serif}
#app{background:radial-gradient(120% 55% at 50% -18%,#2b100b 0,transparent 60%),var(--bg)}
header{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.02em}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP";font-weight:900;font-size:17px;color:#fff;box-shadow:0 6px 18px -4px #ff4d2eaa}
.logo span{color:var(--ink)}.logo small{color:var(--muted);font-weight:600;font-size:15px}
.chip{background:var(--bg2);border:1px solid var(--line);padding:3px 8px;font-weight:600;font-size:11.5px}
main{padding:4px 14px 16px}
nav{margin:0 10px 10px;border:1px solid var(--line);border-radius:20px;background:#121217ee;backdrop-filter:blur(14px)}
nav button{font-weight:600;font-size:10px;padding:9px 0 9px;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
nav button.on::before{content:"";position:absolute;top:-1px;left:32%;right:32%;height:2px;background:var(--acc);border-radius:2px;box-shadow:0 0 10px var(--acc)}
nav .dot{top:7px;right:30%;background:var(--acc);box-shadow:0 0 0 2px #121217}
.btn{background:var(--acc);box-shadow:0 10px 26px -10px #ff4d2ecc;border-radius:12px;font-weight:800}
.btn.ghost{background:var(--bg2);border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#ffb547,#ff4d2e)}
.btn:disabled{background:#17171c;color:#55555f;border:1px solid var(--line);box-shadow:none}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.event{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:14px;padding:10px 12px}
.event b{color:var(--ink)}
.sec{display:flex;align-items:baseline;gap:8px;margin:16px 2px 9px}
.sec .no{font-family:"Noto Sans JP";color:var(--acc);font-weight:900;font-size:12px}
.sec .t{font-weight:800;font-size:18px;letter-spacing:-.02em}
.sec .jp{color:var(--muted);font-size:11px;font-family:"Noto Sans JP";font-weight:700;margin-left:auto}
.packWrap{padding:0}
.pack{width:100%;height:auto;min-height:150px;flex-direction:row;align-items:stretch;justify-content:flex-start;border-radius:18px;background:var(--bg2);border:1px solid var(--line);box-shadow:none;animation:none;overflow:hidden}
.pack::before{display:none}
.pack .art{width:120px;flex:none;position:relative;background:radial-gradient(circle at 30% 20%,#ff8a5c,#ff4d2e 40%,#7a1408);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pack .art::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,#ffffff55 50%,transparent 58%);animation:shine 3.2s linear infinite}
.pack .kj{font-family:"Noto Sans JP";font-weight:900;font-size:78px;color:#fff;text-shadow:0 6px 20px #0006;line-height:1}
.pack .inf{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pack .bn{font-weight:800;font-size:19px;letter-spacing:-.02em}
.pack .tags{display:flex;flex-wrap:wrap;gap:5px}
.pack .tag{font-size:10.5px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}
.pack .tag.a{border-color:#ff4d2e66;color:#ff8a6c}
.pack.shake{animation:shake2 .45s ease-in-out infinite}
@keyframes shake2{0%,100%{transform:none}25%{transform:translateX(-4px) rotate(-1deg)}75%{transform:translateX(4px) rotate(1deg)}}
.stats{gap:6px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;font-size:10px}
.oddrow{display:grid;grid-template-columns:90px 1fr 46px;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.oddrow .bar{height:6px;background:#22222a;border-radius:99px;overflow:hidden}.oddrow .bar i{display:block;height:100%;border-radius:99px}
.card{border-width:2px;border-radius:12px}
.card .rb{font-size:7.5px;letter-spacing:.08em;border-radius:4px;padding:2px 5px}
.card .ce,.card .cnt,.card .lv{background:#000000c8;border-radius:5px}
.filters button{background:var(--bg2);border-color:var(--line);font-weight:600}
.filters button.on{background:var(--acc);border-color:var(--acc);color:#fff}
input[type=search]{background:var(--bg2);border-color:var(--line);border-radius:12px}
.ovl{background:#09090cf2}
#modal .mbox{background:var(--bg2);border:1px solid var(--line);border-radius:20px}
#battle{background:radial-gradient(circle at 50% 42%,#2a120c,#09090c 70%)}
.vs{color:var(--acc);font-family:"Noto Sans JP"}
.world{border:1px solid #ffffff1a;border-radius:18px}
.world::after{content:attr(data-kj);position:absolute;right:-4px;top:-16px;font-size:96px;font-family:"Noto Sans JP";font-weight:900;opacity:.14;pointer-events:none}
.world .wt{font-size:17px;letter-spacing:-.02em}
.stg{background:#00000059;backdrop-filter:blur(4px);border-color:#ffffff26;border-radius:10px}
.quest{background:var(--bg2);border-color:var(--line);border-radius:14px}
.statgrid div{background:var(--bg2);border:1px solid var(--line)}
.slot{border-color:var(--line);background:var(--bg2)}
.power{font-weight:900;letter-spacing:-.02em}
#demoBanner{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--E)}
.foot{color:#5c5c6a}

/* ===== PILE DE CARTES ===== */
#stack{position:relative;width:min(64vw,250px);aspect-ratio:2.5/3.6;margin:6px auto 0}
.sc{position:absolute;inset:0;touch-action:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;cursor:grab}
.sc .inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.sc.flipped .inner{transform:rotateY(180deg)}
.sc .back,.sc .front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sc .front{transform:rotateY(180deg)}
.sc .back{border-radius:14px;background:radial-gradient(circle at 50% 35%,#3a1510,#120808 70%);border:2px solid #ff4d2e88;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans JP";font-size:90px;font-weight:900;color:#ff4d2e33}
.sc.glowE .back{box-shadow:0 0 34px var(--E);border-color:var(--E)}
.sc.glowL .back{box-shadow:0 0 44px var(--L);border-color:var(--L);animation:pulse 1s infinite}
.sc.glowM .back{box-shadow:0 0 56px var(--M);border-color:var(--M);animation:pulse .55s infinite}
.sc .card{height:100%;border-radius:14px}
.sc *{pointer-events:none}.card img{-webkit-user-drag:none;user-drag:none}
.sc .card .nm{font-size:16px}.sc .card .sr{font-size:11.5px}.sc .card .rb{font-size:10px;padding:3px 7px}.sc .card .ce{font-size:14px}.sc .card .stars{font-size:12px}
.sc .card .ov{padding:30px 10px 8px}
.sc .new{bottom:-10px;font-size:11px}

.sc.fly{transition:transform .42s ease-in,opacity .42s}
.sc.glitch .inner{animation:glitch .1s steps(2) infinite}
@keyframes glitch{0%{transform:rotateY(180deg) translate(3px,-2px) skewX(5deg);filter:hue-rotate(120deg) saturate(3)}100%{transform:rotateY(180deg) translate(-4px,3px) skewX(-5deg);filter:hue-rotate(-120deg) brightness(1.8)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}

@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.fob{position:absolute;top:12%;left:0;right:0;text-align:center;font-family:"Noto Sans JP";font-weight:900;font-size:36px;color:#fff;text-shadow:0 0 18px var(--M),0 0 40px var(--L);animation:fob 2.2s forwards;z-index:41;pointer-events:none;line-height:1.1}
.fob small{display:block;font-size:15px;color:#ffd34d}
@keyframes fob{0%{transform:scale(3) rotate(-8deg);opacity:0}15%{transform:scale(1) rotate(-3deg);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(1.1) rotate(-3deg)}}
#rcount{color:var(--muted);font-size:12px;font-weight:700;margin-top:18px;text-align:center}

#revealGrid .card{width:100%}
.sumc{width:30%;position:relative}

/* ===== OUVERTURE DU BOOSTER ===== */

#pkwrap{perspective:900px}
#pk{--W:220px;--H:330px;--lid:58px;width:var(--W);height:var(--H);position:relative;touch-action:none;cursor:grab;transform-style:preserve-3d;will-change:transform}

.foil{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff55 45%,#ffe4a8 50%,#ffffff40 55%,transparent 70%);background-size:300% 300%;mix-blend-mode:overlay;pointer-events:none}
.crimp{position:absolute;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,#0003 0 4px,#fff2 4px 8px)}
.crimp.t{top:0}.crimp.b{bottom:0}
.pk-line{position:absolute;left:6px;right:6px;bottom:0;border-bottom:2px dashed #ffffffaa}
.tear{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.pk-glow{position:absolute;left:-10px;right:-10px;top:calc(var(--lid) - 30px);height:60px;background:radial-gradient(ellipse at 50% 50%,#fff 0,#ffe7a8 25%,transparent 70%);opacity:0;z-index:5;pointer-events:none;filter:blur(2px)}
#opwait{display:none;color:var(--muted);font-size:13px;margin-top:16px}

/* ===== DÉCOR DE L'UNIVERS (fiche) ===== */
#detail{background:var(--bg)}
.dbg{position:absolute;left:0;right:0;top:0;height:420px;background-size:cover;background-position:center;opacity:0;transition:opacity .8s;animation:kb 22s ease-in-out infinite alternate;z-index:0}
.dbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#09090c55 0,#09090c88 45%,var(--bg) 100%)}

#detail>*:not(.dbg){position:relative;z-index:1}
.dsrc{font-size:10.5px;color:#ffffffaa;margin-top:2px}

/* ===== RARETÉS DIVIN & COSMOS ===== */
:root{--D:#ffd96a;--X:#9b86ff}
.D{--rc:var(--D)}.X{--rc:var(--X)}
.stats{grid-template-columns:repeat(4,1fr)!important}

.card.D .rb{background:linear-gradient(90deg,#fff3b0,#ffd34d);color:#4a3200}
.card.X{border-color:transparent;background:linear-gradient(120deg,#7b5cff,#00e5ff,#ff4dd8,#7b5cff) border-box;background-size:300% 300%;animation:cos 4s linear infinite;box-shadow:0 0 22px #7b5cffaa}
@keyframes cos{to{background-position:300% 0}}
.card.X .rb{background:linear-gradient(90deg,#7b5cff,#00e5ff,#ff4dd8);color:#fff}
.card.D::after,.card.X::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background-size:250% 100%;animation:holo 2.2s linear infinite}
.card.D::after{background-image:linear-gradient(115deg,transparent 30%,#fff6c980 45%,#ffffff30 55%,transparent 70%)}
.card.X::after{background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 12%,#fff,transparent),radial-gradient(1.4px 1.4px at 40% 44%,#fff,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1.2px 1.2px at 25% 70%,#fff,transparent),linear-gradient(115deg,transparent 30%,#9b86ff70 45%,#00e5ff40 55%,transparent 70%);background-size:100% 100%,100% 100%,100% 100%,100% 100%,100% 100%,250% 100%}
.sc.glowD .back{box-shadow:0 0 70px var(--D),0 0 20px #fff;border-color:var(--D);animation:pulse .45s infinite}
.sc.glowX .back{box-shadow:0 0 90px #7b5cff,0 0 40px #00e5ff;border-color:#00e5ff;animation:pulse .32s infinite,hue 2s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.fobD{text-shadow:0 0 18px #ffd96a,0 0 40px #fff6c9;color:#fff8d6}
.fobX{background:linear-gradient(90deg,#9b86ff,#00e5ff,#ff4dd8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px #7b5cff)}

header .res{flex-wrap:nowrap;gap:3px}

.rays{position:absolute;left:50%;top:-180px;width:900px;height:900px;margin-left:-450px;pointer-events:none;z-index:1;opacity:.35;mix-blend-mode:screen;
 background:repeating-conic-gradient(from 0deg,#ffe9a066 0deg 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spinr 40s linear infinite}

 background:radial-gradient(ellipse at 20% 30%,#7b5cff88,transparent 55%),radial-gradient(ellipse at 80% 20%,#00e5ff66,transparent 50%),radial-gradient(ellipse at 60% 70%,#ff4dd866,transparent 55%);animation:neb 9s ease-in-out infinite alternate}

#battle{padding:10px 8px;justify-content:space-between;overflow:hidden}

#bhead{font-weight:800}

.bu{width:64px;text-align:center;position:relative;transition:opacity .5s,filter .5s,transform .5s}

@keyframes bhit{0%{filter:brightness(3)}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}100%{filter:none;transform:none}}

#bfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}

.scbtn{position:absolute!important;top:12px;right:12px;z-index:5!important;border:1px solid #ffffff33;background:#0009;backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:5px 10px}

/* ===== notifications, multi-ouverture ===== */

/* ===== décors de lieux ===== */
#bbg{background-size:cover!important;background-position:center!important}

@keyframes ember{to{transform:translate(40px,-110vh);opacity:0}}
.bpart.firefly i{top:auto;bottom:10%;width:calc(4px*var(--s));height:calc(4px*var(--s));border-radius:50%;background:#ffe08a;box-shadow:0 0 10px #ffd34d;animation:ffly ease-in-out infinite alternate}

#cine .chero,#cine .ckj,#cine .cname{display:none}

@keyframes spdrot{to{transform:rotate(30deg)}}

@keyframes mp1{0%{opacity:0;transform:translateY(30px) scale(1.15)}12%{opacity:1;transform:none}88%{opacity:1;filter:none}100%{opacity:0;filter:brightness(3)}}
@keyframes mp2{0%,14%{opacity:0;transform:translateY(30px) scale(1.15)}27%{opacity:1;transform:none}88%{opacity:1;filter:none}100%{opacity:0;filter:brightness(3)}}
@keyframes mp3{0%,29%{opacity:0;transform:translateY(30px) scale(1.15)}42%{opacity:1;transform:none}88%{opacity:1;filter:none}100%{opacity:0;filter:brightness(3)}}
@keyframes bub{0%,44%{opacity:0;transform:scale(.4)}54%{opacity:1;transform:scale(1.08)}58%{transform:scale(1)}100%{opacity:1;transform:scale(1)}}

#cine.foe .mp{box-shadow:0 0 0 2px #fff,0 0 24px #ff4d6d}

.pcard2.creator{position:relative;overflow:hidden;border:2px solid transparent!important;background:linear-gradient(135deg,#2e1d05,#1a0f24 60%,#0d1428) padding-box,linear-gradient(90deg,#ffd76a,#ff9a3c,#ff5ea8,#a46bff,#4de1ff,#ffd76a) border-box!important;background-size:100% 100%,300% 100%!important;animation:crB 5s linear infinite;box-shadow:0 0 22px rgba(255,200,80,.35),0 0 50px rgba(164,107,255,.18)}

@keyframes crN{to{background-position:200% 0}}
.crbadge{display:inline-flex;align-items:center;gap:5px;margin:2px 0 4px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.06em;color:#2a1600;background:linear-gradient(90deg,#ffe9a3,#ffc94a,#ffe9a3);background-size:200% 100%;animation:crN 2.5s linear infinite;box-shadow:0 0 12px rgba(255,201,74,.6)}
.crbadge small{font-weight:700;opacity:.75}
.crown{display:inline-block;animation:crC 2s ease-in-out infinite}@keyframes crC{50%{transform:translateY(-2px) rotate(-6deg)}}

.spine{position:relative;border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,hsl(var(--sh),60%,28%),hsl(var(--sh),75%,48%) 30%,hsl(var(--sh),70%,40%) 70%,hsl(var(--sh),60%,24%));box-shadow:inset 0 0 0 1px #0004,2px 0 3px #0006;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;cursor:grab;transform-origin:bottom center;transition:transform .35s cubic-bezier(.3,1.4,.4,1),opacity .4s,filter .4s;touch-action:none;user-select:none}

.ctone{position:absolute;inset:0;background:radial-gradient(#0003 1px,transparent 1.6px) 0 0/7px 7px;mix-blend-mode:multiply}
.ckj{font-family:"Noto Sans JP";font-size:96px;font-weight:900;line-height:1.1;margin-top:20px;text-shadow:0 4px 0 #0005;z-index:1}

.bookstage.on .bookwrap.riffle{transform:rotateX(-6deg) rotateY(14deg) scale(1)}

/* netteté + fluidité : pas d'animations lourdes dans les grilles (sinon le WebView Android baisse la résolution) */
.grid>div{min-width:0}
.grid .card::after{display:none!important}
.grid .card.X{animation:none!important;background-size:100% 100%}
.grid .card .mframe *{animation:none!important}

function hash(n){n=Math.abs(n)>>>0;n=Math.imul(n^(n>>>16),2246822507);n=Math.imul(n^(n>>>13),3266489909);return(n^(n>>>16))>>>0}

function npcName(r){const a=SYL[Math.floor(r()*SYL.length)],b=SYL[Math.floor(r()*SYL.length)];const st=[`${a}${b}`,`${a}${b}${Math.floor(r()*99)}`,`${a[0].toUpperCase()+a.slice(1)}_${b}`,`xX${a}${b}Xx`,`${a}${b}.exe`,`Sensei${b}`][Math.floor(r()*6)];return st.charAt(0).toUpperCase()+st.slice(1)}
const gNeed=l=>Math.round(400*Math.pow(l,1.45));

const NPCG=[{name:"Les Gardiens du Ciel",emblem:"鳳",color:"#2d9bff",lvl:6,n:44},{name:"Clan du Lotus",emblem:"桜",color:"#ff5d9e",lvl:4,n:31},{name:"Ordre du Dragon",emblem:"龍",color:"#ff4d2e",lvl:9,n:67},{name:"Ronins de Minuit",emblem:"月",color:"#9b6bff",lvl:3,n:22}];
function newGuild(o,leader,members){const r=rng(Date.now()%99991);const m=[];for(let i=0;i<members;i++)m.push({n:npcName(r),c:Math.floor(r()*800),j:Date.now()-Math.floor(r()*20)*86400000});
 S.guild={name:o.name,emblem:o.emblem,color:o.color,leader,lvl:o.lvl||1,xp:0,members:m,feed:[],last:Date.now(),chestAt:Date.now(),my:0,unl:{},equip:{},created:Date.now()};
 DECOS.forEach(d=>{if(d.lvl<=S.guild.lvl)S.guild.unl[d.id]=1});gfeed(leader?"🏯 Tu as fondé la guilde "+o.name+" !":"🤝 Tu as rejoint "+o.name);save();applyDeco()}
function gfeed(t){const g=S.guild;if(!g)return;g.feed.unshift({t:Date.now(),x:t});g.feed=g.feed.slice(0,25)}
function gxp(n,mine){const g=S.guild;if(!g)return;g.xp+=n;if(mine)g.my+=n;let up=0;while(g.xp>=gNeed(g.lvl)){g.xp-=gNeed(g.lvl);g.lvl++;up++;
  const nd=DECOS.filter(d=>d.lvl===g.lvl);nd.forEach(d=>g.unl[d.id]=1);const rw=bonusRw({boosters:2+Math.floor(g.lvl/2),shards:100*g.lvl,oni:5+g.lvl});
  addGift(g.emblem,"Guilde niveau "+g.lvl+" !","Ta guilde progresse grâce à l'activité de ses membres"+(g.leader?" (bonus de chef +10 %)":"")+(nd.length?". Débloqué : "+nd.map(d=>d.n).join(", "):"."),rw);
  gfeed("⬆️ La guilde passe niveau "+g.lvl+(nd.length?" · 🎨 "+nd.map(d=>d.n).join(", "):""))}if(up)notify(g.emblem,"Ta guilde passe niveau "+g.lvl+" !")}
function bonusRw(rw){if(!S.guild||!S.guild.leader)return rw;const o={};for(const k in rw)o[k]=Math.ceil((rw[k]||0)*1.1);return o}
function guildTick(){const g=S.guild;if(!g)return;const now=Date.now(),dt=Math.min(8*3600,Math.max(0,(now-g.last)/1000));if(dt<1)return;g.last=now;const H=dt/3600;
 // activité des membres : chaque membre rapporte de l'XP de guilde
 const act=g.members.length*(14+Math.random()*12)*H;if(act>0){const share=g.members.length?act/g.members.length:0;g.members.forEach(m=>m.c+=Math.round(share*(.4+Math.random()*1.2)));gxp(act,false)}
 // recrutement : plus la guilde est grande et active, plus elle attire de monde
 dailyReset();const eng=Object.values(S.daily.c||{}).reduce((a,b)=>a+b,0);const rate=(1.2+g.lvl*.7+g.members.length*.03)*(.6+Math.min(1.6,eng/12));
 let exp=rate*H;let joins=Math.floor(exp)+(Math.random()<exp%1?1:0);const r=rng(now%99991);
 while(joins-->0&&g.members.length<gCap(g)){const nm=npcName(r);g.members.push({n:nm,c:0,j:now});if(g.members.length%5===0||Math.random()<.3)gfeed("👋 "+nm+" a rejoint la guilde")}
 if(g.members.length>8&&Math.random()<.02*H){const k=Math.floor(Math.random()*g.members.length);gfeed("🚪 "+g.members[k].n+" a quitté la guilde");g.members.splice(k,1)}
 if(Math.random()<.3*H&&g.members.length){const m=pick(g.members);gfeed("✨ "+m.n+" a "+pick(["ouvert 10 boosters","gagné un raid","maîtrisé une Mythique","battu un boss","complété ses quêtes"]))}
 const sig=gSig(g);
 if(view==="guild"&&sig!==guildTick.sig&&!document.querySelector("#modal[style*='flex']")&&!document.querySelector("#picker[style*='flex']"))gRefresh();guildTick.sig=sig;
 const cb=$("gChest");if(cb&&cb.disabled)cb.textContent="Prochain coffre dans "+fmtT(g.chestAt-Date.now());if(Math.random()<.05)save()}
function chestRw(g){return bonusRw({boosters:1+Math.floor(g.lvl/3)+Math.floor(g.members.length/25),oni:3+g.lvl,shards:25*g.lvl+4*g.members.length,frag:g.lvl>=10?1:0})}

 if(!g){h+=`<div class="box"><b>🏯 Fonde ta guilde</b><div class="muted" style="margin:4px 0 10px">Le fondateur devient <b>chef</b> et reçoit <b>+10 %</b> sur toutes les récompenses de guilde.</div><button class="btn" id="gCreate">Créer une guilde</button></div>

  <div class="muted" style="margin-top:10px;font-size:11.5px">🤖 Pour l'instant, les autres membres sont des PNJ. Ils seront remplacés par de vrais joueurs quand le jeu passera en ligne.</div>`;
  $("main").innerHTML=h;$("gCreate").onclick=createGuild;$("main").querySelectorAll("[data-gj]").forEach(b=>b.onclick=()=>{const x=NPCG[+b.dataset.gj];newGuild(x,false,x.n);toast(x.emblem+" Bienvenue dans "+x.name+" !");rGuild()});return}
 h+=`<div id="gBody"></div>`;$("main").innerHTML=h;gRefresh()}
function gSig(g){const R=graidState();return g.lvl+"|"+g.members.length+"|"+(g.feed[0]&&g.feed[0].t)+"|"+(Date.now()>=g.chestAt)+"|"+Math.floor(R.hp/R.max*100)+"|"+R.used+"|"+R.dead}
function guildRank(){const g=S.guild;const L=NPCG.filter(x=>!g||x.name!==g.name).map(x=>({n:x.name,e:x.emblem,c:x.color,l:x.lvl,m:x.n,me:false}));if(g)L.push({n:g.name,e:g.emblem,c:g.color,l:g.lvl,m:g.members.length,me:true,x:g.xp});
 L.sort((a,b)=>b.l-a.l||b.m-a.m||(b.me?1:0)-(a.me?1:0));return`<div class="sec"><span class="no">順</span><span class="t">Classement des guildes</span><span class="jp">順位</span></div><div class="grank">${L.map((x,i)=>`<div class="gr ${x.me?"me":""}" style="--gc:${x.c}"><span class="gp">${i+1}</span><div class="gem2">${x.e}</div><div style="flex:1;min-width:0"><b>${esc(x.n)}</b><div class="muted" style="font-size:12px">Niveau ${x.l} · ${x.m} membres${x.me?" · ta guilde":""}</div></div></div>`).join("")}</div>`}
function gRefresh(){const g=S.guild,el=$("gBody");if(!g||!el)return;guildTick.sig=gSig(g);const now=Date.now(),ready=now>=g.chestAt,pct=Math.min(100,g.xp/gNeed(g.lvl)*100),rw=chestRw(g);

  <div style="font-size:11px;opacity:.8">${fmt(g.xp)} / ${fmt(gNeed(g.lvl))} XP de guilde</div></div></div>
 <div class="gstats"><div><b>👥 ${g.members.length+1}</b><span>membres / ${gCap(g)+1}</span></div><div><b>⚡ ${fmt(g.my)}</b><span>ta contribution</span></div><div><b>🎨 ${Object.keys(g.unl).length}</b><span>décos débloquées</span></div></div>
 <div class="box"><b>🎁 Coffre de guilde</b><div class="muted" style="font-size:12px;margin:3px 0 8px">Se remplit toutes les 8 h. Plus la guilde est grande et haute en niveau, plus il est gros.</div>
  <div class="grw" style="margin-bottom:8px">${rwText(rw)}${g.leader?' <span class="muted" style="font-weight:600">(bonus chef inclus)</span>':""}</div>
  <button class="btn ${ready?"gold":""}" id="gChest" ${ready?"":"disabled"}>${ready?"Ouvrir le coffre":"Prochain coffre dans "+fmtT(g.chestAt-now)}</button></div>
 <div class="box"><b>🎨 Personnalisation</b><div class="muted" style="font-size:12px;margin:3px 0 8px">Thèmes, dos de cartes, cadres d'avatar, bannières, titres… débloqués avec le niveau de la guilde.</div><button class="btn ghost" id="gDeco">Personnaliser</button>
  ${next.length?`<div class="muted" style="margin-top:8px;font-size:12px">Prochains déblocages : ${next.map(d=>`<b>${d.n}</b> (niv. ${d.lvl})`).join(" · ")}</div>`:""}</div>

function stageKey(w,s){return w+"-"+s}
function stageStars(w,s){return S.prog[stageKey(w,s)]||0}
function stageOpen(w,s){if(w===0&&s===1)return true;if(s>1)return stageStars(w,s-1)>0;return stageStars(w-1,10)>0}
function enemyP(g){return 55*Math.pow(1.115,g-1)}
const WRAR=[{m:["C"],b:"R"},{m:["C","R"],b:"E"},{m:["R","E"],b:"L"},{m:["E","L"],b:"M"},{m:["L","M"],b:"D"}];
async function foeCard(rid,seed){const r=RAR[RI[rid]];return charAt(r.min+hash(seed)%(r.max-r.min+1),r)}
function mkFoe(card,P,boss){const k=clsOf(card),e=elOf(card);return{name:card.name,img:card.img,card,rarity:card.rarity,el:e,cls:k,maxhp:Math.round(P*9*k.hp*(boss?4.5:1)),atk:Math.round(P*.95*k.atk*(boss?1.5:1)),spd:k.spd+(boss?6:0),boss}}
// difficulté : les ennemis sont calibrés sur la puissance de TON équipe (et un plancher qui monte avec les mondes)
function stageRatio(w,s){return s===10?1.15+.07*w:.5+.045*(s-1)+.07*w}
function diffLabel(r){return r<.7?["Facile","var(--ok)"]:r<.9?["Normal","#4da3ff"]:r<1.1?["Difficile","#ffb547"]:["Très difficile","var(--M)"]}
function scaleFoes(list,ratio,floorP){const unit=list.reduce((a,e)=>a+e.atk*4+e.maxhp/5,0),spd=list.reduce((a,e)=>a+e.spd,0);
 const P=Math.max(floorP,(teamPower()*ratio-spd)/Math.max(1,unit));list.forEach(e=>{e.maxhp=Math.max(1,Math.round(e.maxhp*P));e.atk=Math.max(1,Math.round(e.atk*P))});return list}
async function makeEnemies(w,s){const g=w*10+s,boss=s===10,R=WRAR[w];const n=boss?2:Math.min(5,2+Math.floor(s/3));
 if(!DEMO){try{const an=await pickAnime(w*100+s*7+3,w+1);const list=await animeFoes(an,n,boss,w*1000+s*37);list.anime=an;scaleFoes(list,stageRatio(w,s),enemyP(g)*.25);return list}catch(e){if(e instanceof TypeError){DEMO=true;$("demoBanner").style.display="block"}}}
 const cards=await Promise.all([...Array(n)].map((_,i)=>foeCard(R.m[(i+s)%R.m.length],w*1000+s*37+i*7+1)));const list=cards.map(c=>mkFoe(c,1,false));
 if(boss)list.splice(1,0,mkFoe(await foeCard(R.b,w*999+77),1,true));return scaleFoes(list,stageRatio(w,s),enemyP(g)*.25)}

const QM=`query($p:Int){Page(page:$p,perPage:25){media(type:ANIME,sort:POPULARITY_DESC,isAdult:false,genre_not_in:["Ecchi","Hentai"]){id title{romaji english} bannerImage coverImage{extraLarge} characters(sort:FAVOURITES_DESC,perPage:16){nodes{id name{full} image{large} favourites}}}}}`;
const MPAGE={};
async function animePage(p){if(MPAGE[p])return MPAGE[p];const key="otaku_mp3_"+p;try{const c=JSON.parse(localStorage.getItem(key)||"null");if(c&&Date.now()-c.t<7*86400000){MPAGE[p]=c.list;return c.list}}catch(_){}
 let res;for(let a=0;a<3;a++){res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query:QM,variables:{p}})});if(res.status===429){await sleep(2500*(a+1));continue}break}
 if(!res.ok)throw new Error("HTTP "+res.status);const j=await res.json();const T=await favThresholds();
 const list=j.data.Page.media.map(m=>({id:m.id,title:m.title.english||m.title.romaji,bg:m.bannerImage||(m.coverImage&&m.coverImage.extraLarge),
  chars:(m.characters.nodes||[]).filter(c=>c.image&&c.image.large).map(c=>{const rid=rarFromFav(c.favourites||0,T);return{id:c.id,name:c.name.full,img:c.image.large,fav:c.favourites||0,series:m.title.english||m.title.romaji,rarity:rid,rank:rankFromFav(c.favourites||0,rid,T)}})})).filter(m=>m.chars.length>=3);
 MPAGE[p]=list;try{localStorage.setItem(key,JSON.stringify({t:Date.now(),list}))}catch(_){}return list}

async function animeBattleBg(cfg){try{const bg=$("bbg");bg.classList.remove("abg");if(typeof DEMO!=="undefined"&&DEMO)return;let url=cfg.enemies&&cfg.enemies.anime&&cfg.enemies.anime.bg;
 if(!url){const cs=[...(cfg.enemies||[]).map(e=>e.card),...teamCards()].filter(c=>c&&+c.id>0);for(const c of cs.slice(0,4)){try{url=await loadBg(c)}catch(_){}if(url)break}}
 if(!url||!B||B.cfg!==cfg)return;const im=new Image();im.referrerPolicy="no-referrer";im.onload=()=>{if(!B||B.cfg!==cfg)return;bg.style.background=`linear-gradient(180deg,#09090ce0 0%,#09090c55 20%,#09090c30 50%,#09090c55 80%,#09090ce6 100%),url("${url}") center/cover`;bg.classList.add("abg")};im.src=url}catch(e){console.warn(e)}}

async function animeFoes(an,n,boss,seed){// le boss = le perso le plus aimé de l'anime, les autres = seconds rôles
 const pool=an.chars.slice(boss?1:0);const out=[];for(let i=0;i<n;i++)out.push(pool[(hash(seed+i*13)%Math.min(pool.length,8)+i)%pool.length]);
 const uniq=[...new Map(out.map(c=>[c.id,c])).values()];while(uniq.length<n&&uniq.length<pool.length){const c=pool.find(x=>!uniq.includes(x));if(!c)break;uniq.push(c)}
 const list=uniq.map(c=>mkFoe(c,1,false));if(boss)list.splice(1,0,mkFoe(an.chars[0],1,true));return list}

  bots:[...Array(2+Math.floor(Math.random()*3))].map(()=>({n:pick(BOTS),max:Math.round(v*(.7+Math.random()*.85))}))}}
async function genOffer(){const mine=Object.values(S.coll);if(!mine.length)return null;const sp=mine.filter(c=>spare(c)>0);const y=pick(sp.length?sp:mine);const yv=cardValue(y);
 for(let k=0;k<4;k++){const ri=Math.max(0,Math.min(RAR.length-1,RI[y.rarity]+pick([-1,0,0,1])));const t=await randCard({[RAR[ri].id]:1});const tv=cardValue(t);

function mkTick(){const m=mkState(),now=Date.now(),dt=Math.min(8*3600,Math.max(0,(now-m.last)/1000));m.last=now;let ch=false;
 // ventes du joueur
 m.sales=m.sales.filter(sa=>{const v=cardValue(sa.c),p=.004*Math.max(.05,Math.min(2,(1.35-sa.price/v)*2));if(Math.random()<1-Math.pow(1-p,dt)){const g=Math.round(sa.price*(1-TAX));S.shards+=g;const b=pick(BOTS);hist(`Vendu ${sa.c.name} à ${b} : +${fmt(g)} 💠`);notify("💰",`${b} a acheté ton ${sa.c.name} : +${fmt(g)} 💠`);sfx.coin();ch=true;return false}return true});
 // enchères
 m.auctions.forEach(a=>{if(a.done)return;const left=a.end-now;
  if(left>0){const pr=left<30000?.22:.06;if(Math.random()<1-Math.pow(1-pr,Math.min(dt,60))){const cur=a.bid||a.start;const cand=a.bots.filter(b=>b.n!==a.leader&&b.max>cur*1.05);
   if(cand.length){const b=pick(cand);const nb=Math.min(b.max,Math.round(Math.max(a.start,cur*(1.05+Math.random()*.1))));if(nb>a.bid){
    if(a.leader==="Toi"){S.shards+=a.hold;a.hold=0;notify("⚠️",`${b.n} t'a surenchéri sur ${a.c.name}`)}a.bid=nb;a.leader=b.n;if(left<20000)a.end+=20000;ch=true}}}}
  else{a.done=true;ch=true;
   if(a.own){if(a.bid>0){const g=Math.round(a.bid*(1-TAX));S.shards+=g;hist(`Enchère : ${a.c.name} vendu à ${a.leader} pour ${fmt(a.bid)} 💠`);notify("🔨",`Ton enchère sur ${a.c.name} est finie : +${fmt(g)} 💠`)}else{addCard(a.c);hist(`Enchère : ${a.c.name} invendu, rendu`);notify("🔨",`Aucune offre pour ${a.c.name}, la carte t'est rendue`)}}
   else if(a.leader==="Toi"){addCard(a.c);hist(`Enchère gagnée : ${a.c.name} pour ${fmt(a.bid)} 💠`);notify("🏆",`Enchère gagnée : ${a.c.name} !`);sfx.win()}}});
 const before=m.auctions.length;m.auctions=m.auctions.filter(a=>!a.done);if(m.visited&&m.auctions.filter(a=>!a.own).length<3&&!mkBusy)fillMarket();
 m.offers=m.offers.filter(o=>o.exp>now);
 if(ch){save();if(view==="mk")mkRefresh()}}
function mkAlert(){const m=S.mk;return!!(m&&m.offers&&m.offers.some(o=>S.coll[o.want]))}
function thumb(c){return`<div class="th">${cardHTML(Object.assign({},c,{lvl:0}))}</div>`}
function rarTag(c){return`<span style="color:var(--${c.rarity});font-weight:800">${RAR[RI[c.rarity]].name}</span>`}
function rMarket(){const m=mkState();m.visited=true;if((!m.listings.length||Date.now()>m.listAt)&&!mkBusy)genListings();if(m.auctions.filter(a=>!a.own).length<3||Date.now()>m.offAt)fillMarket();
 const tabs=[["buy","Acheter"],["sell","Vendre",m.sales.length],["auc","Enchères",m.auctions.filter(a=>a.leader==="Toi"||a.own).length],["trade","Échanges",m.offers.filter(o=>S.coll[o.want]).length]];
 let h=`${sec("01","Marché","市場")}<div class="subtabs">${tabs.map(([k,n,c])=>`<button data-mt="${k}" class="${mkTab===k?"on":""}">${n}${c?`<span class="n">${c}</span>`:""}</button>`).join("")}</div><div id="mkBody"></div>
 <div class="muted" style="margin-top:12px;font-size:11.5px">🤖 Marché simulé : pour l'instant, les autres joueurs sont des PNJ. Commission du marché : ${TAX*100} % sur tes ventes.</div>`;
 $("main").innerHTML=h;$("main").querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{mkTab=b.dataset.mt;rMarket()});mkRefresh()}
function mkRefresh(){const el=$("mkBody");if(!el)return;const m=mkState(),now=Date.now();let h="";
 if(mkTab==="buy"){h+=`<div class="mksearch"><input type="search" id="mkQ" placeholder="🔍 Rechercher une carte (ex : nom d'un perso)" value="${esc(mkQuery)}"><button class="btn sm" id="mkGo" style="width:auto">Chercher</button></div><div id="mkRes"></div><div class="row2" style="margin-bottom:8px"><div class="muted" style="align-self:center">Nouvelles offres dans <span class="timer2" data-cd="${m.listAt}"></span></div><button class="btn ghost sm" id="mkRef" style="flex:.6">🔄 15 💠</button></div>`;
  if(mkBusy&&!m.listings.length)h+=`<div class="muted" style="text-align:center;padding:30px">Chargement des offres…</div>`;
  m.listings.forEach(l=>{const v=cardValue(l.c),d=l.price/v;h+=`<div class="lst">${thumb(l.c)}<div class="inf"><div class="nm2">${esc(l.c.name)}</div><div class="sub">${rarTag(l.c)} · ${esc(l.c.series)}</div><div class="sub">Vendeur : ${esc(l.seller)}${S.coll[l.c.id]?" · <span style='color:var(--ok)'>déjà possédée</span>":" · <span style='color:#ffd34d'>nouvelle !</span>"}</div>
   <div class="pr">${fmt(l.price)} 💠 <span class="vb ${d<.9?"good":d>1.2?"bad":"mid"}">${d<.9?"Bonne affaire":d>1.2?"Cher":"Prix correct"}</span></div></div><div class="act"><button class="btn sm" data-buy="${l.id}" ${S.shards<l.price?"disabled":""}>Acheter</button></div></div>`})}
 else if(mkTab==="sell"){h+=`<button class="btn" id="mkSellNew">＋ Mettre une carte en vente</button><div class="muted" style="margin:8px 2px">Les PNJ achètent plus vite si ton prix est proche ou en dessous de la valeur de la carte.</div>`;
  if(!m.sales.length)h+=`<div class="muted" style="text-align:center;padding:16px">Aucune vente en cours.</div>`;
  m.sales.forEach(sa=>{const v=cardValue(sa.c);h+=`<div class="lst">${thumb(sa.c)}<div class="inf"><div class="nm2">${esc(sa.c.name)}</div><div class="sub">${rarTag(sa.c)} · valeur estimée ${fmt(v)} 💠</div><div class="pr">${fmt(sa.price)} 💠</div><div class="sub">En vente depuis ${Math.floor((now-sa.at)/60000)} min</div></div><div class="act"><button class="btn ghost sm" data-cancel="${sa.id}">Retirer</button></div></div>`});
  if(m.hist.length)h+=`<div class="box hist"><b>Historique</b>${m.hist.map(t=>`<div>${esc(t)}</div>`).join("")}</div>`}
 else if(mkTab==="auc"){h+=`<button class="btn ghost" id="mkAucNew">🔨 Mettre une de mes cartes aux enchères</button><div style="height:8px"></div>`;
  if(!m.auctions.length)h+=`<div class="muted" style="text-align:center;padding:20px">Chargement des enchères…</div>`;
  m.auctions.slice().sort((a,b)=>a.end-b.end).forEach(a=>{const cur=a.bid||a.start,me=a.leader==="Toi",nb=a.bid?Math.ceil(a.bid*1.08)+1:a.start;
   h+=`<div class="lst">${thumb(a.c)}<div class="inf"><div class="nm2">${esc(a.c.name)}</div><div class="sub">${rarTag(a.c)} · ${a.own?"<b>ta carte</b>":"par "+esc(a.seller)} · valeur ~${fmt(cardValue(a.c))} 💠</div>
   <div class="pr">${fmt(cur)} 💠 <span class="sub">${a.bid?(me?"<span class='lead'>· tu mènes</span>":"· "+esc(a.leader)):"· mise de départ"}</span></div><div class="sub">⏱️ <span class="timer2" data-cd="${a.end}"></span></div></div>
   <div class="act">${a.own?"":`<button class="btn sm ${me?"ghost":""}" data-bid="${a.id}" ${me||S.shards+(me?a.hold:0)<nb?"disabled":""}>${me?"En tête":"Miser "+fmt(nb)}</button>`}</div></div>`})}
 else{h+=`<div class="box" style="margin:0 0 12px"><b>🤝 Échanger avec un ami</b><div class="muted" style="margin:3px 0 8px">Envoie une carte sous forme de code, ton ami la récupère dans son jeu. Pour un échange, vous vous envoyez chacun un code.</div>
  <div class="row2"><button class="btn sm" id="fSend">📤 Envoyer une carte</button><button class="btn ghost sm" id="fRecv">📥 Recevoir une carte</button></div>${(S.sent||[]).length?`<div class="muted" style="margin-top:8px;font-size:11.5px">Derniers envois : ${(S.sent||[]).slice(0,3).map(x=>`<a href="#" data-sc="${x.t}" style="color:var(--muted)">${esc(x.name)}</a>`).join(", ")}</div>`:""}</div>
  <div style="font-weight:800;margin:4px 2px 8px">Propositions des PNJ</div>`;
  const offers=m.offers.filter(o=>S.coll[o.want]);if(!offers.length)h+=`<div class="muted" style="text-align:center;padding:24px">Pas de proposition pour le moment. De nouvelles arrivent dans <span class="timer2" data-cd="${m.offAt}"></span>.</div>`;
  offers.forEach(o=>{const y=S.coll[o.want],yv=cardValue(y),tv=cardValue(o.give),d=tv/yv;
   h+=`<div class="trade"><div class="sub muted" style="margin-bottom:4px"><b style="color:var(--ink)">${esc(o.from)}</b> te propose un échange · expire dans <span class="timer2" data-cd="${o.exp}"></span></div>
   <div class="row"><div class="side">Tu reçois${cardHTML(Object.assign({},o.give,{lvl:0}))}${rarTag(o.give)}<br>~${fmt(tv)} 💠</div><div class="arrow">⇄</div><div class="side">Tu donnes${cardHTML(y)}${rarTag(y)}<br>~${fmt(yv)} 💠${y.n>1?`<br><span class="muted">(tu en as ×${y.n})</span>`:"<br><span style='color:var(--M)'>dernier exemplaire</span>"}</div></div>
   <div style="text-align:center;margin:6px 0"><span class="vb ${d>1.05?"good":d<.95?"bad":"mid"}">${d>1.05?"Avantageux pour toi":d<.95?"Désavantageux":"Échange équilibré"}</span></div>
   <div class="row2"><button class="btn ghost sm" data-dec="${o.id}">Refuser</button><button class="btn sm" data-acc="${o.id}">Accepter</button></div></div>`})}
 el.innerHTML=h;mkTimers();const mq=$("mkQ");if(mq){const go=()=>{mkQuery=mq.value.trim();marketSearch()};$("mkGo").onclick=go;mq.onkeydown=e=>{if(e.key==="Enter")go()};if(mkQuery&&mkResults)drawSearch()}const fs=$("fSend");if(fs){fs.onclick=sendToFriend;$("fRecv").onclick=receiveFromFriend;el.querySelectorAll("[data-sc]").forEach(a=>a.onclick=e=>{e.preventDefault();const x=(S.sent||[]).find(y=>String(y.t)===a.dataset.sc);if(x)showCode({name:x.name},x.code)})}
 const q=x=>el.querySelectorAll(x);
 const rf=$("mkRef");if(rf)rf.onclick=()=>{if(S.shards<15){toast("Il faut 15 💠");return}S.shards-=15;m.listings=[];updateTop();genListings();mkRefresh()};
 q("[data-buy]").forEach(b=>b.onclick=()=>{const l=m.listings.find(x=>x.id===b.dataset.buy);if(!l||S.shards<l.price)return;S.shards-=l.price;addCard(l.c);m.listings=m.listings.filter(x=>x!==l);hist(`Acheté ${l.c.name} à ${l.seller} : -${fmt(l.price)} 💠`);save();sfx.coin();toast("🛍️ "+l.c.name+" ajouté à ta collection");updateTop();mkRefresh()});
 q("[data-cancel]").forEach(b=>b.onclick=()=>{const sa=m.sales.find(x=>x.id===b.dataset.cancel);if(!sa)return;addCard(sa.c);m.sales=m.sales.filter(x=>x!==sa);save();toast("Carte retirée de la vente");mkRefresh()});
 q("[data-bid]").forEach(b=>b.onclick=()=>{const a=m.auctions.find(x=>x.id===b.dataset.bid);if(!a||a.leader==="Toi")return;const nb=a.bid?Math.ceil(a.bid*1.08)+1:a.start;if(S.shards<nb){toast("Pas assez d'éclats");return}
  S.shards-=nb;a.hold=nb;a.bid=nb;a.leader="Toi";if(a.end-Date.now()<20000)a.end+=20000;save();sfx.coin();toast("🔨 Tu mènes l'enchère : "+fmt(nb)+" 💠");updateTop();mkRefresh()});
 q("[data-acc]").forEach(b=>b.onclick=()=>{const o=m.offers.find(x=>x.id===b.dataset.acc);if(!o||!S.coll[o.want])return;const gone=takeCard(o.want);addCard(o.give);m.offers=m.offers.filter(x=>x!==o);hist(`Échange avec ${o.from} : ${gone.name} ⇄ ${o.give.name}`);save();sfx.evo();toast("🤝 Échange conclu : "+o.give.name);mkRefresh()});
 q("[data-dec]").forEach(b=>b.onclick=()=>{m.offers=m.offers.filter(x=>x.id!==b.dataset.dec);save();mkRefresh()});
 const sn=$("mkSellNew");if(sn)sn.onclick=()=>pickCard("Choisis la carte à vendre",c=>sellPrompt(c));
 const an=$("mkAucNew");if(an)an.onclick=()=>pickCard("Choisis la carte à mettre aux enchères",c=>{const v=cardValue(c);
  modal(`<h3>Mettre aux enchères</h3>${cardHTML(c)}<p class="muted">Mise de départ : <b>${fmt(Math.round(v*.5))} 💠</b> · durée 5 minutes.<br>Les PNJ vont surenchérir. Commission : ${TAX*100} %.</p>`,[["Annuler"],["🔨 Lancer",()=>{const cc=takeCard(c.id);
   m.auctions.push({id:Math.random().toString(36).slice(2),c:cc,own:true,seller:"Toi",bid:0,start:Math.round(v*.5),leader:null,hold:0,end:Date.now()+5*60000,bots:[...Array(2+Math.floor(Math.random()*3))].map(()=>({n:pick(BOTS),max:Math.round(v*(.6+Math.random()*.8))}))});
   save();mkTab="auc";rMarket();toast("🔨 Enchère lancée !")}]])})}

// ===== recherche au marché =====
let mkQuery="",mkResults=null;
const QS=`query($q:String){Page(perPage:12){characters(search:$q,sort:FAVOURITES_DESC){id name{full} image{large} favourites media(perPage:3,sort:POPULARITY_DESC){nodes{isAdult title{romaji english}}}}}}`;
async function marketSearch(){const box=$("mkRes");if(!box)return;if(mkQuery.length<2){mkResults=null;box.innerHTML="";return}box.innerHTML='<div class="muted" style="padding:10px;text-align:center">Recherche…</div>';
 let list=[];try{
  if(DEMO){const q=mkQuery.toLowerCase();for(let p=1;p<=60;p++){demoPage(p).forEach((c,i)=>{if(c.name.toLowerCase().includes(q))list.push(Object.assign({},c,{rank:(p-1)*50+i+1}))});if(list.length>=12)break}list=list.slice(0,12).map(c=>Object.assign(c,{rarity:rarOfRank(c.rank).id}))}
  else{const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query:QS,variables:{q:mkQuery}})});if(!res.ok)throw new Error("HTTP "+res.status);
   const j=await res.json(),T=await favThresholds();list=j.data.Page.characters.filter(c=>c.image&&c.image.large&&!(c.media.nodes||[]).some(m=>m.isAdult)).map(c=>{const m=(c.media.nodes||[])[0];const rid=rarFromFav(c.favourites||0,T);
    return{id:c.id,name:c.name.full,img:c.image.large,fav:c.favourites||0,series:m?(m.title.english||m.title.romaji):"???",rarity:rid,rank:rankFromFav(c.favourites||0,rid,T)}})}
 }catch(e){if(e instanceof TypeError&&!DEMO){DEMO=true;return marketSearch()}box.innerHTML='<div class="muted" style="padding:10px">😵 Recherche impossible pour le moment.</div>';return}
 mkResults=list.map(c=>{const v=cardValue(c);const r=rng(hash(c.id)+Math.floor(Date.now()/3600000));return{c:slim(c),seller:BOTS[Math.floor(r()*BOTS.length)],price:Math.round(v*(1.25+r()*.5)),id:"s"+c.id}});drawSearch()}
function drawSearch(){const box=$("mkRes");if(!box||!mkResults)return;
 if(!mkResults.length){box.innerHTML='<div class="muted" style="padding:10px;text-align:center">Aucune carte trouvée.</div>';return}
 box.innerHTML=`<div class="muted" style="margin:2px 2px 6px;font-size:12px">${mkResults.length} résultat(s) · prix « sur commande » un peu plus élevés que le marché</div>`+mkResults.map(l=>`<div class="lst">${thumb(l.c)}<div class="inf"><div class="nm2">${esc(l.c.name)}</div><div class="sub">${rarTag(l.c)} · ${esc(l.c.series)}</div><div class="sub">Vendeur : ${esc(l.seller)}${S.coll[l.c.id]?" · <span style='color:var(--ok)'>déjà possédée</span>":""}</div><div class="pr">${fmt(l.price)} 💠</div></div><div class="act"><button class="btn sm" data-sbuy="${l.id}" ${S.shards<l.price?"disabled":""}>Acheter</button></div></div>`).join("")+`<div style="height:6px;border-bottom:1px solid var(--line);margin-bottom:10px"></div>`;
 box.querySelectorAll("[data-sbuy]").forEach(b=>b.onclick=()=>{const l=mkResults.find(x=>x.id===b.dataset.sbuy);if(!l||S.shards<l.price)return;S.shards-=l.price;addCard(l.c);hist(`Acheté ${l.c.name} (sur commande) : -${fmt(l.price)} 💠`);save();sfx.coin();notify("🛍️",l.c.name+" ajouté à ta collection");updateTop();drawSearch()})}

function mkTimers(){document.querySelectorAll("[data-cd]").forEach(e=>{const ms=+e.dataset.cd-Date.now();const s=Math.max(0,Math.ceil(ms/1000));e.textContent=s>=3600?Math.floor(s/3600)+" h "+String(Math.floor(s%3600/60)).padStart(2,"0"):Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s<=30&&ms>0)e.style.color="var(--M)"})}

// ================= ÉCHANGE ENTRE AMIS (code à partager) =================
const TSECRET="otk-🍙-2026";
function b64e(str){return btoa(unescape(encodeURIComponent(str)))}function b64d(str){return decodeURIComponent(escape(atob(str)))}
function makeGiftCode(c){const o={v:1,c:slim(c),n:Math.random().toString(36).slice(2)+Date.now().toString(36)};const j=JSON.stringify(o);return"OTK1."+b64e(j)+"."+hash(hstr(j+TSECRET)).toString(36)}
function readGiftCode(code){code=(code||"").trim().replace(/\s+/g,"");const p=code.split(".");if(p.length!==3||p[0]!=="OTK1")throw new Error("Code invalide");
 const j=b64d(p[1]);if(hash(hstr(j+TSECRET)).toString(36)!==p[2])throw new Error("Code abîmé ou modifié");return JSON.parse(j)}
function sendToFriend(){pickCard("Choisis la carte à envoyer",c=>{modal(`<h3>Envoyer ${esc(c.name)} ?</h3><div style="width:110px;margin:0 auto">${cardHTML(c)}</div><p class="muted">La carte va <b>quitter ta collection</b> et devenir un code à envoyer à ton ami (WhatsApp, Snap, Discord…). Elle reprend son niveau 1 chez lui.</p>`,
  [["Annuler"],["📤 Créer le code",()=>{const cc=takeCard(c.id);const code=makeGiftCode(cc);S.sent=(S.sent||[]);S.sent.unshift({t:Date.now(),name:cc.name,code});S.sent=S.sent.slice(0,20);save();
   notify("📤","Code créé pour "+cc.name+" : envoie-le à ton ami",true);showCode(cc,code)}]])})}
function showCode(c,code){modal(`<h3>Code de ${esc(c.name)}</h3><p class="muted">Copie ce code et envoie-le à ton ami. Il le colle dans Marché → Échanges → « Recevoir une carte ».</p><textarea id="gcode" readonly style="width:100%;height:90px;font-size:10px">${code}</textarea>`,
 [["Fermer"],["📋 Copier",()=>{const t=$("gcode");try{navigator.clipboard.writeText(code).then(()=>toast("📋 Code copié"),()=>{})}catch(_){}t&&t.select();try{document.execCommand("copy");toast("📋 Code copié")}catch(_){}}]])}
function receiveFromFriend(){modal(`<h3>Recevoir une carte</h3><p class="muted">Colle ici le code que ton ami t'a envoyé.</p><textarea id="rcode" style="width:100%;height:90px;font-size:11px" placeholder="OTK1.…"></textarea>`,
 [["Annuler"],["📥 Récupérer",()=>{try{const o=readGiftCode($("rcode").value);S.redeemed=S.redeemed||[];if(S.redeemed.includes(o.n))throw new Error("Ce code a déjà été utilisé");
   S.redeemed.push(o.n);addCard(o.c);save();sfx.evo();notify("📥","Tu as reçu "+o.c.name+" ("+RAR[RI[o.c.rarity]].name+") d'un ami !");if(view==="mk")rMarket()}catch(e){toast("❌ "+e.message)}}]])}

function pickCard(title,cb){const p=$("picker");const list=Object.values(S.coll).sort((a,b)=>RI[b.rarity]-RI[a.rarity]||a.rank-b.rank);
 p.style.display="flex";p.innerHTML=`<div style="font-weight:900;font-size:18px;margin:4px 0 10px">${title}</div><div class="pgrid">${list.map(c=>`<div data-pk="${c.id}">${cardHTML(c,{lv:1,cnt:1,team:S.team.includes(c.id)})}<div class="muted" style="text-align:center;font-size:11px">~${fmt(cardValue(c))} 💠</div></div>`).join("")||'<div class="muted">Aucune carte</div>'}</div>
 <button class="btn ghost sm" id="pkClose" style="max-width:200px;margin:14px 0 30px">Annuler</button>`;
 $("pkClose").onclick=()=>p.style.display="none";p.querySelectorAll("[data-pk]").forEach(d=>d.onclick=()=>{const c=S.coll[d.dataset.pk];p.style.display="none";if(c)cb(c)})}
function sellPrompt(c){const v=cardValue(c);const m=mkState();if(m.sales.length>=5){toast("5 ventes maximum en même temps");return}
 modal(`<h3>Vendre ${esc(c.name)}</h3><div style="width:120px;margin:0 auto">${cardHTML(c)}</div><p class="muted" style="margin:8px 0 0">Valeur estimée : <b>${fmt(v)} 💠</b>${c.n<=1?"<br><span style='color:var(--M)'>⚠️ C'est ton dernier exemplaire</span>":""}</p>
 <div class="priceIn"><button class="btn ghost sm" style="width:auto" id="pm">−10 %</button><input id="pIn" type="number" inputmode="numeric" value="${v}"><button class="btn ghost sm" style="width:auto" id="pp">+10 %</button></div><div id="pHint" class="muted"></div>
 <div class="muted" style="margin-top:8px">Ou revends-la tout de suite au marchand pour <b>${fmt(Math.round(v*.6))} 💠</b>.</div>`,

function passUnclaimed(P){const l=passLvl(P),a=[];for(let t=1;t<=l;t++)if(!P.got[t])a.push(t);return a}

function synergies(cards){const out=[];let atk=0,hp=0,spd=0;const ser={};cards.forEach(c=>{const k=(c.series||"?").toLowerCase();ser[k]=ser[k]||{n:c.series,c:0};ser[k].c++});
 Object.values(ser).forEach(s=>{if(s.c>=2&&s.n){const b=Math.min(40,(s.c-1)*10);atk+=b;hp+=b;out.push({ic:"📺",t:`${s.n} ×${s.c}`,d:`+${b} % ATQ et PV`})}});
 const el={};cards.forEach(c=>{const e=elOf(c);el[e.id]=el[e.id]||{e,c:0};el[e.id].c++});Object.values(el).forEach(x=>{if(x.c>=3){const b=x.c>=4?25:15;atk+=b/2;spd+=x.c>=4?6:4;out.push({ic:x.e.ic,t:`Résonance ${x.e.name} ×${x.c}`,d:`+${b/2} % ATQ, +${x.c>=4?6:4} VIT`})}});
 const cl=new Set(cards.map(c=>clsOf(c).id));if(cl.has("tnk")&&cl.has("hea")&&cl.size>=4){hp+=12;out.push({ic:"🛡️",t:"Formation équilibrée",d:"+12 % PV (tank + soigneur + 4 classes)"})}
 return{list:out,atk,hp,spd,maxSeries:Math.max(0,...Object.values(ser).map(s=>s.c))}}
function synHTML(cards){const s=synergies(cards);return`<div class="box"><b>🔗 Synergies</b><div class="muted" style="font-size:12px;margin:2px 0 6px">Mets des persos du même anime, du même élément ou une équipe équilibrée pour des bonus.</div>${s.list.length?s.list.map(x=>`<div class="syn"><span>${x.ic} <b>${esc(x.t)}</b></span><span>${x.d}</span></div>`).join(""):'<div class="muted" style="font-size:12.5px">Aucune synergie active.<br>📺 2+ persos du même anime : +10 % par perso · 🔥 3+ du même élément · 🛡️ tank + soigneur + 4 classes</div>'}</div>`}
